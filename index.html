      const todayStr = new Date().toISOString().slice(0, 10);

      const [novoBoletim, setNovoBoletim] = useState({

        localNascimento: '',

        docPais: 'PRT',

        localResidencia: '',

        dataSaida: '',

        numeroUnidade: '1',
        eMenor: 'Não',
        titularDoc: 'Próprio',
        qualidadeAcompanhante: 'N/A',
        valorReserva: '',
        taxaTuristica: '0.00',
        modoPagamento: 'Numerário',
        numeroReserva: '',
        plataformaReserva: 'sem reserva'
      });

      const [numeroNoites, setNumeroNoites] = useState(0);

      const calcularDiferencaNoites = (d1Str, d2Str) => {
        if (!d1Str || !d2Str) return 0;
        const dIn = new Date(d1Str);
        const dOut = new Date(d2Str);
        const diffTime = dOut - dIn;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays > 0 ? diffDays : 0;
      };

      useEffect(() => {
        setNumeroNoites(calcularDiferencaNoites(novoBoletim.dataEntrada, novoBoletim.dataSaida));
      }, [novoBoletim.dataEntrada, novoBoletim.dataSaida]);

      const formatarDataLimpa = (dStr) => {
        if (!dStr) return '';
        const str = String(dStr).trim();
        if (str.length >= 10 && str.match(/^\d{4}-\d{2}-\d{2}/)) {
          return str.slice(0, 10);
        }
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          return d.toISOString().slice(0, 10);
        }
        return str.slice(0, 10);
      };

      const formatarMoedaAvançada = (val) => {
        if (val === undefined || val === null || val === '') return '0.00';
        let str = String(val).replace('€', '').replace(/\s+/g, '').trim();
        str = str.replace(',', '.');
        const num = parseFloat(str);
        return isNaN(num) ? '0.00' : num.toFixed(2);
      };

      const handleNumeroReservaChange = (val) => {
        const numLimpo = val;
        setNovoBoletim(prev => {
          if (!numLimpo.trim()) {
            return { ...prev, numeroReserva: numLimpo, plataformaReserva: 'sem reserva' };
          } else {
            const platAtual = prev.plataformaReserva === 'sem reserva' ? 'Booking' : prev.plataformaReserva;
            return { ...prev, numeroReserva: numLimpo, plataformaReserva: platAtual };
          }
        });
      };

      const processarLinhaPorIndice = (r) => {
        let arr = [];
        let rIndex = 0;

        if (Array.isArray(r)) {
          arr = r;
          rIndex = r.rowIndex || 0;
        } else if (typeof r === 'object' && r !== null) {
          rIndex = r.rowIndex || 0;
          arr = [
            r.ID_Boletim || r[0] || '',
            r.Data_Registo || r[1] || '',
            r.Apelido || r[2] || '',
            r.Nome || r[3] || '',
            r.Data_Nascimento || r[4] || '',
            r.Nacionalidade || r[5] || '',
            r.Local_Nascimento || r[6] || '',
            r.Tipo_Documento || r[7] || '',
            r.Numero_Documento || r[8] || '',
            r.Pais_Emissor || r[9] || '',
            r.Pais_Residencia || r[10] || '',
            r.Local_Residencia || r[11] || '',
            r.Check_In || r[12] || '',
            r.Check_Out || r[13] || '',
            r.Tipo_Alojamento || r[14] || '',
            r.Numero_Unidade || r[15] || '',
            r.E_Menor || r[16] || '',
            r.Titular_Documento || r[17] || '',
            r.Qualidade_Acompanhante || r[18] || '',
            r.Valor_Reserva || r[19] || '',
            r.Taxa_Turistica || r[20] || '',
            r.Modo_Pagamento || r[21] || '',
            r.Funcionario_Rececao || r[22] || '',
            r.Numero_Reserva || r[23] || '',
            r.Plataforma_Reserva || r[24] || 'sem reserva'
          ];
        }

        const idBoletim = String(arr[0] || 'CV-HIST').trim();
        const apelido = String(arr[2] || '').trim();
        const nome = String(arr[3] || '').trim();
        const nomeFormatadoComprovativo = nome ? `${apelido}, ${nome}` : apelido;
        const dataNascimento = formatarDataLimpa(arr[4]);
        const nacionalidade = String(arr[5] || 'PRT').trim();
        const localNascimento = String(arr[6] || '').trim();
        const docTipo = String(arr[7] || 'B').trim();
        const docNumero = String(arr[8] || '').trim();
        const docPais = String(arr[9] || 'PRT').trim();
        const paisResidencia = String(arr[10] || 'PRT').trim();
        const localResidencia = String(arr[11] || '').trim();
        const dataEntrada = formatarDataLimpa(arr[12]);
        const dataSaida = formatarDataLimpa(arr[13]);
        const tipoAlojamento = String(arr[14] || 'Quarto Duplo com Vista Mar').trim();
        const numeroUnidade = String(arr[15] || '1').trim();
        const eMenor = String(arr[16] || 'Não').trim();
        const titularDoc = String(arr[17] || 'Próprio').trim();
        const qualidadeAcompanhante = String(arr[18] || 'N/A').trim();
        const valorReserva = formatarMoedaAvançada(arr[19]);
        const taxaTuristica = formatarMoedaAvançada(arr[20]);
        const modoPagamento = String(arr[21] || 'Numerário').trim();
        const funcRececao = String(arr[22] || selectedFuncObj.nome).trim();
        const numeroReserva = String(arr[23] || '').trim();
        const plataformaReserva = String(arr[24] || (numeroReserva ? 'Booking' : 'sem reserva')).trim();

        let funcId = '';
        if (funcRececao && funcRececao.includes('[') && funcRececao.includes(']')) {
          funcId = funcRececao.split('[')[1].split(']')[0];
        }

        return {
          rowIndex: rIndex,
          idBoletim,
          apelido,
          nome,
          nomeCompleto: nomeFormatadoComprovativo,
          dataNascimento,
          nacionalidade,
          localNascimento,
          paisResidencia,
          localResidencia,
          docTipo,
          docNumero,
          docPais,
          tipoAlojamento,
          numeroUnidade,
          dataEntrada,
          dataSaida,
          noitesCalculadas: calcularDiferencaNoites(dataEntrada, dataSaida),
          eMenor,
          titularDoc,
          qualidadeAcompanhante,
          valorReserva,
          taxaTuristica,
          modoPagamento,
          funcionarioNome: funcRececao,
          funcionarioId: funcId || selectedFuncObj.id || '',
          numeroReserva,
          plataformaReserva
        };
      };

      useEffect(() => {
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: "GET_EMPLOYEES" })
        })
        .then(res => res.json())
        .then(res => {
          if (res.status === "success" && res.data && res.data.length > 0) {
            setFuncionarios(res.data);
            setSelectedFuncObj(res.data[0]);
          }
        })
        .catch(() => {});
      }, []);

      useEffect(() => {
        const docLimpo = (novoBoletim.docNumero || '').trim();
        if (docLimpo.length < 4) {
          setAlertaRecorrente(null);
          return;
        }

        const timer = setTimeout(async () => {
          setVerificandoDoc(true);
          try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: "SEARCH_GUEST", query: docLimpo })
            });
            const result = await response.json();

            if (result.status === "success" && result.data && result.data.length > 0) {
              const ultimoRaw = result.data[result.data.length - 1];
              const norm = processarLinhaPorIndice(ultimoRaw);
              const totalEstadias = result.data.length;

              setAlertaRecorrente({
                nome: norm.nomeCompleto,
                estadias: totalEstadias,
                ultimaEntrada: norm.dataEntrada
              });

              setNovoBoletim(prev => ({
                ...prev,
                apelido: norm.apelido || prev.apelido,
                nome: norm.nome || prev.nome,
                nacionalidade: norm.nacionalidade || prev.nacionalidade,
                localNascimento: norm.localNascimento || prev.localNascimento,
                docTipo: norm.docTipo || prev.docTipo,
                docPais: norm.docPais || prev.docPais,
                paisResidencia: norm.paisResidencia || prev.paisResidencia,
                localResidencia: norm.localResidencia || prev.localResidencia
              }));

              if (norm.dataNascimento) {
                const parts = norm.dataNascimento.split('-');
                if (parts.length === 3) {
                  setNasceAno(parts[0]);
                  setNasceMes(parts[1]);
                  setNasceDia(parts[2]);
                  setNovoBoletim(prev => ({ ...prev, dataNascimento: norm.dataNascimento }));
                }
              }
            } else {
              setAlertaRecorrente(null);
            }
          } catch (e) {
          } finally {
            setVerificandoDoc(false);
          }
        }, 600);

        return () => clearTimeout(timer);
      }, [novoBoletim.docNumero]);

      const handleSelectNascimento = (ano, mes, dia) => {
        setNasceAno(ano);
        setNasceMes(mes);
        setNasceDia(dia);

        if (ano && mes && dia) {
          const formattedDate = `${ano}-${mes}-${String(dia).padStart(2, '0')}`;
          setNovoBoletim(prev => ({ ...prev, dataNascimento: formattedDate }));
        }
      };

      useEffect(() => {
        if (!novoBoletim.dataNascimento) {
          setIdadeCalculada(null);
          setNovoBoletim(prev => ({ ...prev, eMenor: 'Não', titularDoc: 'Próprio', qualidadeAcompanhante: 'N/A' }));
          return;
        }

        const nascimento = new Date(novoBoletim.dataNascimento);
        const hoje = new Date(novoBoletim.dataEntrada || todayStr);
        
        let idade = hoje.getFullYear() - nascimento.getFullYear();
        const m = hoje.getMonth() - nascimento.getMonth();
        if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) {
          idade--;
        }

        if (!isNaN(idade)) {
          setIdadeCalculada(idade);
          const valorSugerido = idade < 16 ? '0.00' : (Math.min(numeroNoites, 7) * 2).toFixed(2);
          setNovoBoletim(prev => ({ 
            ...prev, 
            taxaTuristica: valorSugerido,
            eMenor: idade < 18 ? 'Sim' : 'Não',
            titularDoc: idade < 18 ? (prev.titularDoc === 'Próprio' ? 'Documento do Acompanhante' : prev.titularDoc) : 'Próprio',
            qualidadeAcompanhante: idade < 18 ? (prev.qualidadeAcompanhante === 'N/A' ? 'Pai, Mãe' : prev.qualidadeAcompanhante) : 'N/A'
          }));
        }
      }, [novoBoletim.dataNascimento, novoBoletim.dataEntrada, numeroNoites]);

      const gerarIDBoletim = () => {
        const d = new Date();
        const datePart = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        const randomPart = Math.floor(1000 + Math.random() * 9000);
        return `CV-${datePart}-${randomPart}`;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();

        if (!novoBoletim.apelido.trim()) {
          alert('Por favor introduza o Apelido do hóspede.');
          return;
        }

        if (!novoBoletim.dataNascimento) {
          alert('Por favor selecione a Data de Nascimento.');
          return;
        }

        if (!novoBoletim.dataSaida || novoBoletim.dataSaida <= novoBoletim.dataEntrada) {
          alert('A data de check-out prevista deve ser posterior à data de check-in.');
          return;
        }

        setLoading(true);

        const idBoletim = gerarIDBoletim();
        const funcionarioString = selectedFuncObj.id 
          ? `[${selectedFuncObj.id}] ${selectedFuncObj.nome}` 
          : selectedFuncObj.nome;

        // Formatação APELIDO, NOME para o comprovativo
        const nomeFormatadoComprovativo = novoBoletim.nome.trim() 
          ? `${novoBoletim.apelido.trim()}, ${novoBoletim.nome.trim()}` 
          : novoBoletim.apelido.trim();

        const payload = { 
          ...novoBoletim, 
          nomeCompleto: nomeFormatadoComprovativo,
          idBoletim, 
          funcionarioRececao: funcionarioString,
          funcionarioId: selectedFuncObj.id || '',
          funcionarioNome: selectedFuncObj.nome || funcionarioString,
          noitesCalculadas: numeroNoites
        };

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
        } catch (error) {
        } finally {
          clearTimeout(timeoutId);
          setLoading(false);
          setUltimoSucesso(payload);

          setNovoBoletim({
            apelido: '',
            nome: '',
            dataNascimento: '',
            nacionalidade: 'PRT',
            localNascimento: '',
            docTipo: 'B',
            docNumero: '',
            docPais: 'PRT',
            paisResidencia: 'PRT',
            localResidencia: '',
            dataEntrada: todayStr,
            dataSaida: '',
            tipoAlojamento: novoBoletim.tipoAlojamento,
            numeroUnidade: novoBoletim.numeroUnidade,
            eMenor: 'Não',
            titularDoc: 'Próprio',
            qualidadeAcompanhante: 'N/A',
            valorReserva: '',
            taxaTuristica: '0.00',
            modoPagamento: 'Numerário',
            numeroReserva: '',
            plataformaReserva: 'sem reserva'
          });
          setNasceAno('');
          setIdadeCalculada(null);
          setAlertaRecorrente(null);
        }
      };

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) return;

        setSearching(true);
        setEditingRegisto(null);

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "SEARCH_GUEST", query: searchQuery })
          });
          const result = await response.json();

          if (result.status === "success") {
            const listMapeada = (result.data || []).map(r => processarLinhaPorIndice(r));
            setSearchResults(listMapeada);

            if (listMapeada.length === 0) {
              alert('Nenhum registo encontrado com o termo pesquisado.');
            }
          }
        } catch (error) {
          alert('Erro ao realizar a pesquisa.');
        } finally {
          setSearching(false);
        }
      };

      const handleUpdateCheckout = async () => {
        if (!novaDataSaida || novaDataSaida <= editingRegisto.dataEntrada) {
          alert('A nova data de saída deve ser posterior à data de check-in.');
          return;
        }

        setUpdating(true);

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: "UPDATE_CHECKOUT",
              rowIndex: editingRegisto.rowIndex,
              newCheckout: novaDataSaida
            })
          });
          const result = await response.json();

          if (result.status === "success") {
            alert(`✅ Data de Check-out atualizada com sucesso para ${novaDataSaida}!`);
            setEditingRegisto(null);
            setSearchResults([]);
            setSearchQuery('');
          } else {
            alert('Erro ao atualizar: ' + result.message);
          }
        } catch (error) {
          alert('Erro ao ligar ao servidor.');
        } finally {
          setUpdating(false);
        }
      };

      const handlePrintFromSearch = (itemMapeado) => {
        setUltimoSucesso(itemMapeado);
      };

      const handlePrintBoletim = () => {
        if (!ultimoSucesso) return;
        const tituloOriginal = document.title;
        const nomeLimpo = (ultimoSucesso.nomeCompleto || 'Hospede').trim().replace(/[^a-zA-Z0-9]/g, '_');
        const nomeFicheiroPDF = `Boletim_${ultimoSucesso.idBoletim}_${nomeLimpo}`;

        document.title = nomeFicheiroPDF;
        window.print();

        setTimeout(() => {
          document.title = tituloOriginal;
        }, 1000);
      };

      return (
        <div className="min-h-screen pb-12">
          {/* CABEÇALHO PRINCIPAL */}
          <header className="bg-slate-900 text-white p-4 shadow-md">
            <div className="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-bold">🏠 Casa Velha</h1>
                  <button 
                    onClick={() => setShowSobreModal(true)}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] font-semibold px-2.5 py-1 rounded transition flex items-center gap-1"
                  >
                    ℹ️ Sobre
                  </button>
                </div>
                <p className="text-xs text-slate-400">Terminal de Check-in (RNAL 166503/AL)</p>
              </div>

              {/* LOGIN DO FUNCIONÁRIO */}
              <div className="bg-slate-800 p-2.5 rounded-lg border border-slate-700 flex items-center gap-2 text-xs w-full md:w-auto">
                <span className="text-slate-400 font-semibold hidden sm:inline">👤 Receção:</span>
                <div className="flex-1 md:flex-initial">
                  {funcionarios.length > 0 ? (
                    <select 
                      value={selectedFuncObj.id || selectedFuncObj.nome}
                      onChange={e => {
                        const val = e.target.value;
                        const found = funcionarios.find(f => f.id === val || f.nome === val);
                        setSelectedFuncObj(found || { id: '', nome: val });
                      }}
                      className="w-full md:w-60 bg-slate-900 text-white border border-slate-600 rounded px-2 py-1.5 font-bold outline-none focus:ring-1 focus:ring-blue-500 text-xs"
                    >
                      {funcionarios.map(f => (
                        <option key={f.id || f.nome} value={f.id || f.nome}>{f.nome}</option>
                      ))}
                    </select>
                  ) : (
                    <input 
                      type="text" 
                      placeholder="Nome do Funcionário" 
                      value={selectedFuncObj.nome}
                      onChange={e => setSelectedFuncObj({ id: 'FUNC', nome: e.target.value })}
                      className="w-full md:w-60 bg-slate-900 text-white border border-slate-600 rounded px-2 py-1.5 font-bold text-xs"
                    />
                  )}
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto p-4 mt-4 space-y-6">

            {/* PAINEL 1: PESQUISAR E ALTERAR CHECK-OUT PREVISTO */}

              <h2 className="text-sm font-bold text-blue-900">🔍 Pesquisar Hóspede, Alterar Check-out, 2ª Via</h2>
              <form onSubmit={handleSearch} className="flex gap-2 text-xs">
                <input 
                  type="text" 
                  placeholder="Pesquisar por N.º de Documento, Nome ou ID do Boletim..." 
                  value={searchQuery} 
                  onChange={e => setSearchQuery(e.target.value)} 
                  className="flex-1 border border-blue-300 p-2.5 rounded bg-white font-medium outline-none focus:ring-2 focus:ring-blue-500" 
                  required 
                />
                <button 
                  type="submit" 
                  disabled={searching}
                  className="bg-blue-700 hover:bg-blue-800 text-white font-bold px-4 rounded transition text-xs disabled:bg-slate-400"
                >
                  {searching ? 'A Pesquisar...' : 'Procurar'}
                </button>
              </form>

              {searchResults.length > 0 && (
                <div className="mt-3 bg-white rounded border border-blue-200 divide-y text-xs">
                  {searchResults.map(r => (
                    <div key={r.rowIndex || r.idBoletim} className="p-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                      <div>
                        <div className="font-bold text-slate-900">{r.nomeCompleto} <span className="text-blue-600 font-mono">({r.idBoletim})</span></div>
                        <div className="text-slate-500">{r.docTipo}: {r.docNumero} | {r.tipoAlojamento} (Unidade {r.numeroUnidade}) | Reserva: <strong>{r.numeroReserva || 'sem reserva'}</strong> ({r.plataformaReserva})</div>
                        <div className="text-slate-700 font-medium">Entrada: {r.dataEntrada} → Saída Atual: <span className="text-amber-700 font-bold">{r.dataSaida}</span></div>
                      </div>
                      <div className="flex gap-2 self-end sm:self-auto">
                        <button 
                          onClick={() => handlePrintFromSearch(r)} 
                          className="bg-slate-800 hover:bg-slate-900 text-white font-semibold px-3 py-1.5 rounded flex items-center gap-1"
                        >
                          🖨️ 2ª Via
                        </button>
                        <button 
                          onClick={() => { setEditingRegisto(r); setNovaDataSaida(r.dataSaida); }} 
                          className="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-3 py-1.5 rounded"
                        >
                          Alterar Check-out
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {editingRegisto && (
                <div className="mt-3 p-4 bg-amber-100 rounded border border-amber-300 text-xs space-y-2">
                  <div className="font-bold text-amber-900">Alterar Saída Prevista para: {editingRegisto.nomeCompleto}</div>
                  <div className="flex items-center gap-3">
                    <div>
                      <label className="block font-semibold text-amber-900 mb-1">Nova Data de Check-out Prevista:</label>
                      <input 
                        type="date" 
                        value={novaDataSaida} 
                        onChange={e => setNovaDataSaida(e.target.value)} 
                        className="border border-amber-400 p-2 rounded bg-white font-bold" 
                        required 
                      />
                    </div>
                    <button 
                      onClick={handleUpdateCheckout} 
                      disabled={updating}
                      className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded self-end disabled:bg-slate-400"
                    >
                      {updating ? 'A Guardar...' : '💾 Confirmar Nova Data'}
                    </button>
                    <button 
                      onClick={() => setEditingRegisto(null)} 
                      className="text-slate-600 hover:underline self-end py-2"
                    >
                      Cancelar
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* PAINEL 2: NOVO FORMULÁRIO DE CHECK-IN */}
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              <div 
                onClick={() => setShowBoletimForm(!showBoletimForm)}
                className="p-5 bg-slate-50 border-b border-slate-200 flex justify-between items-center cursor-pointer select-none hover:bg-slate-100 transition"
              >
                <div>
                  <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    📋 Novo Boletim de Alojamento
                  </h2>
                </div>
                <button type="button" className="text-slate-600 hover:text-slate-900 text-lg font-bold p-1">
                  {showBoletimForm ? '▲' : '▼'}
                </button>
              </div>

              {showBoletimForm && (
                <div className="p-6 space-y-4">

                  {/* BANNER DE BOAS-VINDAS A HÓSPEDE RECORRENTE */}
                  {alertaRecorrente && (
                    <div className="p-4 bg-emerald-100 border border-emerald-300 rounded-xl text-emerald-900 text-xs shadow-sm flex items-start justify-between gap-3">
                      <div className="space-y-1">
                        <div className="font-bold text-sm flex items-center gap-2">
                          🌟 Hóspede Recorrente Detetado!
                        </div>
                        <p>
                          Bem-vindo de novo a Casa Velha, <strong>{alertaRecorrente.nome}</strong>! Esta é a sua <strong>{alertaRecorrente.estadias + 1}ª estadia</strong> connosco (última entrada em {formatarDataLimpa(alertaRecorrente.ultimaEntrada)}).
                        </p>
                      </div>
                      <button 
                        type="button" 
                        onClick={() => setAlertaRecorrente(null)} 
                        className="text-emerald-700 font-bold hover:text-emerald-950 text-base"
                      >
                        ✕
                      </button>
                    </div>
                  )}

                  <form onSubmit={handleSubmit} className="space-y-4 text-sm">
                    
                    {/* 1. Documento de Identificação */}
                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                      <div className="flex justify-between items-center">
                        <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wider">
                          1. Documento de Identificação
                        </h3>
                        {verificandoDoc && (
                          <span className="text-[11px] text-blue-600 font-semibold animate-pulse">
                            🔍 A verificar histórico...
                          </span>
                        )}
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Tipo de Documento *</label>
                          <select 
                            value={novoBoletim.docTipo} 
                            onChange={e => setNovoBoletim({...novoBoletim, docTipo: e.target.value})} 
                            className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium text-xs"
                          >
                            <option value="B">B - Bilhete de Identidade / CC</option>
                            <option value="P">P - Passaporte</option>
                            <option value="O">O - Outro Documento</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Número do Documento *</label>
                          <input 
                            type="text" 
                            placeholder="Sem espaços" 
                            value={novoBoletim.docNumero} 
                            onChange={e => setNovoBoletim({...novoBoletim, docNumero: e.target.value.replace(/\s+/g, '').toUpperCase()})} 
                            className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none font-mono font-bold text-slate-900 text-xs" 
                            maxLength={16}
                            required 
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">País Emissor (Código ICAO) *</label>
                          <select 
                            value={novoBoletim.docPais} 
                            onChange={e => setNovoBoletim({...novoBoletim, docPais: e.target.value})} 
                            className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium text-xs"
                          >
                            {PAISES_ICAO.map(p => <option key={p.code} value={p.code}>{p.nome} ({p.code})</option>)}
                          </select>
                        </div>
                      </div>
                    </div>

                    {/* 2. Nomes e Identificação Pessoal */}
                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                      <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wider">2. Nomes e Identificação Pessoal</h3>
                      
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Apelido (Último Nome / Família) *</label>
                          <input 
                            type="text" 
                            placeholder="Ex: SILVA (Obrigatório)" 
                            value={novoBoletim.apelido} 
                            onChange={e => setNovoBoletim({...novoBoletim, apelido: sanitizarTextoAIMA(e.target.value)})} 
                            className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-900 text-xs uppercase" 
                            maxLength={40}
                            required 
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Outros Nomes (Opcional se for nome único)</label>
                          <input 
                            type="text" 
                            placeholder="Ex: JOÃO MANUEL" 
                            value={novoBoletim.nome} 
                            onChange={e => setNovoBoletim({...novoBoletim, nome: sanitizarTextoAIMA(e.target.value)})} 
                            className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none font-medium text-xs uppercase" 
                            maxLength={40}
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                        {/* SELEÇÃO DE NASCIMENTO */}
                        <div className="bg-white p-3 rounded border border-slate-200">
                          <div className="flex justify-between items-center mb-1">
                            <label className="block text-xs font-semibold text-slate-700">Data Nascimento *</label>
                            {idadeCalculada !== null && (
                              <span className="text-[10px] font-bold bg-slate-200 px-1.5 py-0.5 rounded">
                                {idadeCalculada} anos
                              </span>
                            )}
                          </div>
                          <div className="grid grid-cols-3 gap-1">
                            <select 
                              value={nasceAno} 
                              onChange={e => handleSelectNascimento(e.target.value, nasceMes, nasceDia)}
                              className="border p-1 rounded text-xs font-bold"
                              required
                            >
                              <option value="">Ano</option>
                              {ANOS_LISTA.map(a => <option key={a} value={a}>{a}</option>)}
                            </select>
                            <select 
                              value={nasceMes} 
                              onChange={e => handleSelectNascimento(nasceAno, e.target.value, nasceDia)}
                              className="border p-1 rounded text-xs"
                            >
                              {MESES_LISTA.map(m => <option key={m.num} value={m.num}>{m.num}</option>)}
                            </select>
                            <select 
                              value={nasceDia} 
                              onChange={e => handleSelectNascimento(nasceAno, nasceMes, e.target.value)}
                              className="border p-1 rounded text-xs"
                            >
                              {Array.from({ length: 31 }, (_, i) => String(i + 1).padStart(2, '0')).map(d => (
                                <option key={d} value={d}>{d}</option>
                              ))}
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Nacionalidade (ICAO) *</label>
                          <select 
                            value={novoBoletim.nacionalidade} 
                            onChange={e => setNovoBoletim({...novoBoletim, nacionalidade: e.target.value})} 
                            className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium text-xs"
                          >
                            {PAISES_ICAO.map(p => <option key={p.code} value={p.code}>{p.nome} ({p.code})</option>)}
                          </select>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Local Nascimento (Opcional)</label>
                          <input

                            placeholder="Cidade" 
                            value={novoBoletim.localNascimento} 
                            onChange={e => setNovoBoletim({...novoBoletim, localNascimento: sanitizarTextoAIMA(e.target.value)})} 
                            className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none font-medium text-xs uppercase"

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">

                          <select

                            onChange={e => setNovoBoletim({...novoBoletim, paisResidencia: e.target.value})} 
                            className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium text-xs"
                          >
                            {PAISES_ICAO.map(p => <option key={p.code} value={p.code}>{p.nome} ({p.code})</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Local Residência (Opcional)</label>
                          <input 
                            type="text" 
                            placeholder="Cidade de residência habitual" 
                            value={novoBoletim.localResidencia} 
                            onChange={e => setNovoBoletim({...novoBoletim, localResidencia: sanitizarTextoAIMA(e.target.value)})} 
                            className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none font-medium text-xs uppercase" 
                            maxLength={30}
                          />
                        </div>
                      </div>
                    </div>

                    {/* 3. Dados da Reserva */}
                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                      <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wider">3. Dados da Reserva</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Tipo de Alojamento *</label>
                          <select 
                            value={novoBoletim.tipoAlojamento} 
                            onChange={e => setNovoBoletim({...novoBoletim, tipoAlojamento: e.target.value})} 
                            className="w-full border border-slate-300 p-2 rounded bg-white text-xs"
                          >
                            {TIPOS_ALOJAMENTO.map(t => <option key={t} value={t}>{t}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Unidade *</label>
                          <input 
                            type="text" 
                            value={novoBoletim.numeroUnidade} 
                            onChange={e => setNovoBoletim({...novoBoletim, numeroUnidade: e.target.value})} 
                            className="w-full border border-slate-300 p-2 rounded text-xs font-bold" 
                            required 
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">N.º Reserva</label>
                          <input 
                            type="text" 
                            placeholder="Opcional" 
                            value={novoBoletim.numeroReserva} 
                            onChange={e => handleNumeroReservaChange(e.target.value)} 
                            className="w-full border border-slate-300 p-2 rounded text-xs" 
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Plataforma *</label>
                          <select 
                            value={novoBoletim.plataformaReserva} 
                            onChange={e => setNovoBoletim({...novoBoletim, plataformaReserva: e.target.value})} 
                            disabled={!novoBoletim.numeroReserva.trim()}
                            className="w-full border border-slate-300 p-2 rounded bg-white text-xs disabled:bg-slate-100"
                          >
                            {PLATAFORMAS_RESERVA.map(p => <option key={p} value={p}>{p}</option>)}
                          </select>
                        </div>
                      </div>
                    </div>

                    {/* PAINEL DE MENOR DE IDADE */}
                    {novoBoletim.eMenor === 'Sim' && (
                      <div className="bg-purple-50 p-4 rounded-lg border border-purple-200 space-y-3">
                        <div className="flex items-center justify-between">
                          <h3 className="font-bold text-purple-900 text-xs uppercase tracking-wider">
                            👶 Hóspede Menor de Idade ({idadeCalculada} anos)
                          </h3>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                          <div>
                            <label className="block font-semibold text-purple-900 mb-1">Titular do Documento *</label>
                            <select 
                              value={novoBoletim.titularDoc} 
                              onChange={e => setNovoBoletim({...novoBoletim, titularDoc: e.target.value})} 
                              className="w-full border border-purple-300 p-2.5 rounded bg-white font-medium"
                            >
                              <option value="Documento do Acompanhante">Documento do Acompanhante / Responsável</option>
                              <option value="Documento Próprio do Menor">Documento Próprio do Menor</option>
                            </select>
                          </div>
                          <div>
                            <label className="block font-semibold text-purple-900 mb-1">Qualidade do Acompanhante *</label>
                            <select 
                              value={novoBoletim.qualidadeAcompanhante} 
                              onChange={e => setNovoBoletim({...novoBoletim, qualidadeAcompanhante: e.target.value})} 
                              className="w-full border border-purple-300 p-2.5 rounded bg-white font-medium"
                            >
                              <option value="Pai, Mãe">Pai, Mãe</option>
                              <option value="Tutor Legal">Tutor Legal</option>
                              <option value="Outro Familiar">Outro Familiar</option>
                              <option value="Acompanhante Autorizado">Acompanhante Autorizado</option>
                            </select>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* 4. Estadia & Valores Financeiros */}
                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                      <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wider">4. Período da Estadia, Pagamentos</h3>
                      
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Data de Entrada (Check-in) *</label>
                          <input 
                            type="date" 
                            value={novoBoletim.dataEntrada} 
                            onChange={e => setNovoBoletim({...novoBoletim, dataEntrada: e.target.value})} 
                            className="w-full border border-slate-300 p-2 rounded text-xs" 
                            required 
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Data Prevista Saída (Check-out) *</label>
                          <input 
                            type="date" 
                            value={novoBoletim.dataSaida} 
                            onChange={e => setNovoBoletim({...novoBoletim, dataSaida: e.target.value})} 
                            className="w-full border border-slate-300 p-2 rounded text-xs" 
                            required 
                          />
                        </div>
                        <div className="bg-white border border-slate-300 p-2 rounded text-center">
                          <span className="text-[10px] block text-slate-500 font-semibold uppercase">Duração</span>
                          <span className="text-xs font-bold text-blue-900">{numeroNoites} {numeroNoites === 1 ? 'Noite' : 'Noites'}</span>
                        </div>
                      </div>

                      {/* TAXA TURÍSTICA */}
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                        <div>
                          <label className="block text-xs font-semibold text-emerald-800 mb-1">Valor Reserva (€)</label>
                          <input 
                            type="number" 
                            step="0.01" 
                            value={novoBoletim.valorReserva} 
                            onChange={e => setNovoBoletim({...novoBoletim, valorReserva: e.target.value})} 
                            className="w-full border border-emerald-300 p-2 rounded bg-emerald-50/50 font-bold text-xs" 
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-emerald-800 mb-1">Taxa Turística (€) *</label>
                          <input 
                            type="number" 
                            step="0.01" 
                            value={novoBoletim.taxaTuristica} 
                            onChange={e => setNovoBoletim({...novoBoletim, taxaTuristica: e.target.value})} 
                            className="w-full border border-emerald-300 p-2 rounded bg-emerald-50/50 font-bold text-xs" 
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-emerald-800 mb-1">Modo Pagamento *</label>
                          <select 
                            value={novoBoletim.modoPagamento} 
                            onChange={e => setNovoBoletim({...novoBoletim, modoPagamento: e.target.value})} 
                            className="w-full border border-emerald-300 p-2 rounded bg-emerald-50/50 font-bold text-xs"
                          >
                            {MODOS_PAGAMENTO.map(m => <option key={m} value={m}>{m}</option>)}
                          </select>
                        </div>
                      </div>
                    </div>

                    <button 
                      type="submit" 
                      disabled={loading}
                      className="w-full bg-blue-700 text-white font-bold py-3.5 rounded-lg hover:bg-blue-800 transition shadow text-base disabled:bg-slate-400"
                    >
                      {loading ? 'A Guardar...' : '💾 Confirmar Check-in'}
                    </button>
                  </form>
                </div>
              )}
            </div>

          </main>

          {/* MODAL: SOBRE O ESTABELECIMENTO */}
          {showSobreModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200">
                <div className="text-center border-b pb-3">
                  <h2 className="text-lg font-bold text-slate-900">🏠 Casa Velha</h2>
                  <p className="text-xs text-slate-500">Informação Legal, Registo de Alojamento Local</p>
                </div>
                <div className="space-y-3 text-xs text-slate-700">
                  <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-2">
                    <div className="flex justify-between"><span>Registo RNAL:</span><strong className="font-mono">166503/AL</strong></div>
                    <div className="flex justify-between"><span>Título Autorização Utilização:</span><strong className="font-mono">N.º 63/18</strong></div>
                  </div>
                </div>
                <button onClick={() => setShowSobreModal(false)} className="w-full bg-slate-800 text-white py-2.5 rounded-lg text-xs font-bold">Fechar</button>
              </div>
            </div>
          )}

          {/* MODAL DE SUCESSO & IMPRESSÃO */}
          {ultimoSucesso && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-slate-200">
                <div id="printable-boletim" className="space-y-4 text-xs font-sans text-slate-800 p-2">
                  <div className="text-center border-b pb-3">
                    <h2 className="text-base font-bold text-slate-900">🏠 Casa Velha, Comprovativo de Check-in</h2>
                    <p className="text-[11px] text-slate-500">Boletim de Alojamento (RNAL n.º 166503/AL)</p>
                    <span className="inline-block mt-1 font-mono font-bold bg-blue-100 text-blue-900 px-2 py-0.5 rounded text-xs">
                      ID Boletim: {ultimoSucesso.idBoletim}
                    </span>
                  </div>

                  <div className="space-y-2 border-b pb-3">
                    <div><strong className="text-slate-600">Hóspede:</strong> {ultimoSucesso.nomeCompleto}</div>
                    <div><strong className="text-slate-600">Data de Nascimento:</strong> {ultimoSucesso.dataNascimento}</div>
                    <div><strong className="text-slate-600">Nacionalidade:</strong> {ultimoSucesso.nacionalidade} | <strong className="text-slate-600">Residência:</strong> {ultimoSucesso.paisResidencia}</div>
                    <div><strong className="text-slate-600">Documento:</strong> Tipo {ultimoSucesso.docTipo} N.º {ultimoSucesso.docNumero} ({ultimoSucesso.docPais})</div>
                    <div><strong className="text-slate-600">Reserva:</strong> {ultimoSucesso.numeroReserva || 'sem reserva'} ({ultimoSucesso.plataformaReserva})</div>
                  </div>

                  <div className="space-y-1 border-b pb-3">
                    <div><strong className="text-slate-600">Alojamento:</strong> {ultimoSucesso.tipoAlojamento} (Unidade {ultimoSucesso.numeroUnidade})</div>
                    <div><strong className="text-slate-600">Check-in:</strong> {formatarDataLimpa(ultimoSucesso.dataEntrada)} → <strong className="text-slate-600">Check-out:</strong> {formatarDataLimpa(ultimoSucesso.dataSaida)} ({ultimoSucesso.noitesCalculadas} noites)</div>
                  </div>

                  <div className="p-3 bg-emerald-50 rounded-lg border border-emerald-200 space-y-1 font-medium text-emerald-900">
                    <div>Valor Reserva: <strong>{ultimoSucesso.valorReserva || '0.00'} €</strong> | Taxa Turística: <strong>{ultimoSucesso.taxaTuristica || '0.00'} €</strong></div>
                    <div>Modo de Pagamento: <strong>{ultimoSucesso.modoPagamento}</strong></div>
                  </div>
                </div>

                <div className="flex gap-3 pt-2 border-t">
                  <button onClick={handlePrintBoletim} className="flex-1 bg-slate-800 text-white font-bold py-2.5 rounded-lg text-xs">🖨️ Imprimir Boletim</button>
                  <button onClick={() => setUltimoSucesso(null)} className="bg-slate-200 text-slate-800 font-semibold px-4 py-2.5 rounded-lg text-xs">Fechar</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CheckInAIMA />);
  </script>
</body>
</html>
