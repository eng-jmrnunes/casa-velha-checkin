<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Velha - Terminal de Check-in & AIMA</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

      body * { visibility: hidden; }
      #printable-boletim, #printable-boletim * { visibility: visible; }
      #printable-boletim { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ⚠️ COLE AQUI O SEU LINK DO GOOGLE APPS SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZitsCHoHUdgDwb2g8OrJEUm6tkXob-XhiywGuRt2ZAIPH9pwTWVvXGc2hQzA4psfbTg/exec";

    const TIPOS_ALOJAMENTO = [
      "Quarto Duplo com Vista Mar",
      "Quarto Triplo",
      "Estúdio",
      "Apartamento Dúplex"
    ];

    const MODOS_PAGAMENTO = [
      "Numerário",
      "Booking",
      "MB",
      "Outro"
    ];

    const PAISES = [
      "Portugal", "Afeganistão", "África do Sul", "Albânia", "Alemanha", "Andorra", "Angola", "Antígua e Barbuda",
      "Arábia Saudita", "Argélia", "Argentina", "Arménia", "Austrália", "Áustria", "Azerbaijão", "Bahamas", "Bangladesh",
      "Barbados", "Barém", "Bélgica", "Belize", "Benim", "Bielorrússia", "Bolívia", "Bósnia e Herzegovina", "Botsuana",
      "Brasil", "Brunei", "Bulgária", "Burquina Faso", "Burundi", "Butão", "Cabo Verde", "Camarões", "Camboja", "Canadá",
      "Catar", "Cazaquistão", "Chade", "Chile", "China", "Chipre", "Ciribati", "Colômbia", "Comores", "Congo-Brazzaville",
      "Coreia do Norte", "Coreia do Sul", "Costa do Marfim", "Costa Rica", "Croácia", "Cuaite", "Cuba", "Dinamarca",
      "Dominica", "Egipto", "Emirados Árabes Unidos", "Equador", "Eritreia", "Eslováquia", "Eslovénia", "Espanha",
      "Estónia", "Eswatini", "Estados Unidos", "Etiópia", "Fiji", "Filipinas", "Finlândia", "França", "Gabão", "Gâmbia",
      "Gana", "Geórgia", "Granada", "Grécia", "Guatemala", "Guiana", "Guiné", "Guiné Equatorial", "Guiné-Bissau",
      "Haiti", "Holanda", "Honduras", "Hungria", "Iémen", "Ilhas Marshall", "Ilhas Salomão", "Índia", "Indonésia",
      "Irão", "Iraque", "Irlanda", "Islândia", "Israel", "Itália", "Jamaica", "Japão", "Jordânia", "Kowait", "Laos",
      "Lesoto", "Letónia", "Líbano", "Libéria", "Líbia", "Liechtenstein", "Lituânia", "Luxemburgo", "Macedónia do Norte",
      "Madagáscar", "Malásia", "Maláui", "Maldivas", "Mali", "Malta", "Marrocos", "Maurícia", "Mauritânia", "México",
      "Mianmar", "Micronésia", "Moçambique", "Moldávia", "Mónaco", "Mongólia", "Montenegro", "Namíbia", "Nauru", "Nepal",
      "Nicarágua", "Níger", "Nigéria", "Noruega", "Nova Zelândia", "Omã", "Palau", "Palestina", "Panamá", "Papua Nova Guiné",
      "Paquistão", "Paraguai", "Peru", "Polónia", "Quénia", "Quirguizistão", "Quiribati", "Reino Unido", "República Centro-Africana",
      "República Checa", "República Democrática do Congo", "República Dominicana", "Roménia", "Ruanda", "Rússia", "Samoa",
      "Santa Lúcia", "São Cristóvão e Neves", "São Marino", "São Tomé e Príncipe", "São Vicente e Granadinas", "Senegal",
      "Sérvia", "Seicheles", "Serra Leoa", "Singapura", "Síria", "Somália", "Sri Lanka", "Sudão", "Sudão do Sul", "Suécia",
      "Suíça", "Suriname", "Tailândia", "Tajiquistão", "Tanzânia", "Timor-Leste", "Togo", "Tonga", "Trindade e Tobago",
      "Tunísia", "Turquemenistão", "Turquia", "Tuvalu", "Ucrânia", "Uganda", "Uruguai", "Uzbequistão", "Vanuatu",
      "Vaticano", "Venezuela", "Vietname", "Zâmbia", "Zimbabué"
    ];

    const ANO_ATUAL = new Date().getFullYear();
    const ANOS_LISTA = Array.from({ length: ANO_ATUAL - 1920 + 1 }, (_, i) => ANO_ATUAL - i);
    const MESES_LISTA = [
      { num: '01', nome: 'Janeiro' }, { num: '02', nome: 'Fevereiro' }, { num: '03', nome: 'Março' },
      { num: '04', nome: 'Abril' }, { num: '05', nome: 'Maio' }, { num: '06', nome: 'Junho' },
      { num: '07', nome: 'Julho' }, { num: '08', nome: 'Agosto' }, { num: '09', nome: 'Setembro' },
      { num: '10', nome: 'Outubro' }, { num: '11', nome: 'Novembro' }, { num: '12', nome: 'Dezembro' }
    ];

    function CheckInAIMA() {
      const [loading, setLoading] = useState(false);
      const [exporting, setExporting] = useState(false);
      
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [searching, setSearching] = useState(false);
      const [editingRegisto, setEditingRegisto] = useState(null);
      const [novaDataSaida, setNovaDataSaida] = useState('');
      const [updating, setUpdating] = useState(false);

      const [idadeCalculada, setIdadeCalculada] = useState(null);
      const [ultimoSucesso, setUltimoSucesso] = useState(null);
      
      const [showSobreModal, setShowSobreModal] = useState(false);
      const [showBoletimForm, setShowBoletimForm] = useState(true);

      // Estado do Operador / Receção
      const [funcionarios, setFuncionarios] = useState([]);
      const [selectedFuncObj, setSelectedFuncObj] = useState({ id: '', nome: '' });
      const [passwordInativa, setPasswordInativa] = useState('');

      const [nasceAno, setNasceAno] = useState('');
      const [nasceMes, setNasceMes] = useState('01');
      const [nasceDia, setNasceDia] = useState('01');

      const [novoBoletim, setNovoBoletim] = useState({
        nome: '',
        dataNascimento: '',
        nacionalidade: 'Portugal',
        docTipo: 'Cartão de Cidadão / BI',
        docNumero: '',
        docPais: 'Portugal',
        paisResidencia: 'Portugal',
        dataEntrada: new Date().toISOString().slice(0, 10),
        dataSaida: '',
        tipoAlojamento: 'Quarto Duplo com Vista Mar',
        numeroUnidade: '1',
        eMenor: 'Não',
        titularDoc: 'Próprio',
        qualidadeAcompanhante: 'N/A',
        valorReserva: '',
        taxaTuristica: '',
        modoPagamento: 'Numerário'
      });

      const todayStr = new Date().toISOString().slice(0, 10);
      const [exportDataInicio, setExportDataInicio] = useState(todayStr);
      const [exportDataFim, setExportDataFim] = useState(todayStr);

      useEffect(() => {
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: "GET_EMPLOYEES" })
        })
        .then(res => res.json())
        .then(res => {
          if (res.status === "success" && res.data && res.data.length > 0) {
            setFuncionarios(res.data);
            setSelectedFuncObj(res.data[0]);
          }
        })
        .catch(() => {});
      }, []);

      const handleSelectNascimento = (ano, mes, dia) => {
        setNasceAno(ano);
        setNasceMes(mes);
        setNasceDia(dia);

        if (ano && mes && dia) {
          const formattedDate = `${ano}-${mes}-${String(dia).padStart(2, '0')}`;
          setNovoBoletim(prev => ({ ...prev, dataNascimento: formattedDate }));
        }
      };

      useEffect(() => {
        if (!novoBoletim.dataNascimento) {
          setIdadeCalculada(null);
          setNovoBoletim(prev => ({ ...prev, eMenor: 'Não', titularDoc: 'Próprio', qualidadeAcompanhante: 'N/A' }));
          return;
        }

        const nascimento = new Date(novoBoletim.dataNascimento);
        const hoje = new Date(novoBoletim.dataEntrada || todayStr);
        
        let idade = hoje.getFullYear() - nascimento.getFullYear();
        const m = hoje.getMonth() - nascimento.getMonth();
        if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) {
          idade--;
        }

        if (!isNaN(idade)) {
          setIdadeCalculada(idade);
          if (idade < 18) {
            setNovoBoletim(prev => ({
              ...prev,
              eMenor: 'Sim',
              titularDoc: prev.titularDoc === 'Próprio' ? 'Documento do Acompanhante' : prev.titularDoc,
              qualidadeAcompanhante: prev.qualidadeAcompanhante === 'N/A' ? 'Pai / Mãe' : prev.qualidadeAcompanhante
            }));
          } else {
            setNovoBoletim(prev => ({
              ...prev,
              eMenor: 'Não',
              titularDoc: 'Próprio',
              qualidadeAcompanhante: 'N/A'
            }));
          }
        }
      }, [novoBoletim.dataNascimento, novoBoletim.dataEntrada]);

      const formatarDataLimpa = (dStr) => {
        if (!dStr) return '';
        return String(dStr).slice(0, 10);
      };

      const gerarIDBoletim = () => {
        const d = new Date();
        const datePart = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        const randomPart = Math.floor(1000 + Math.random() * 9000);
        return `CV-${datePart}-${randomPart}`;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();

        if (!novoBoletim.dataNascimento) {
          alert('Por favor selecione o Ano, Mês e Dia de Nascimento.');
          return;
        }

        if (novoBoletim.dataSaida <= novoBoletim.dataEntrada) {
          alert('A data de check-out prevista deve ser posterior à data de check-in.');
          return;
        }

        setLoading(true);

        const idBoletim = gerarIDBoletim();
        const funcionarioString = selectedFuncObj.id 
          ? `[${selectedFuncObj.id}] ${selectedFuncObj.nome}` 
          : selectedFuncObj.nome;

        const payload = { 
          ...novoBoletim, 
          idBoletim, 
          funcionarioRececao: funcionarioString,
          funcionarioId: selectedFuncObj.id || 'N/A',
          funcionarioNome: selectedFuncObj.nome || funcionarioString
        };

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          setUltimoSucesso(payload);

          setNovoBoletim({
            nome: '',
            dataNascimento: '',
            nacionalidade: 'Portugal',
            docTipo: 'Cartão de Cidadão / BI',
            docNumero: '',
            docPais: 'Portugal',
            paisResidencia: 'Portugal',
            dataEntrada: new Date().toISOString().slice(0, 10),
            dataSaida: '',
            tipoAlojamento: novoBoletim.tipoAlojamento,
            numeroUnidade: novoBoletim.numeroUnidade,
            eMenor: 'Não',
            titularDoc: 'Próprio',
            qualidadeAcompanhante: 'N/A',
            valorReserva: '',
            taxaTuristica: '',
            modoPagamento: 'Numerário'
          });
          setNasceAno('');
          setIdadeCalculada(null);
        } catch (error) {
          alert('❌ Erro ao ligar ao servidor. Verifique a ligação à internet.');
        } finally {
          setLoading(false);
        }
      };

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) return;

        setSearching(true);
        setEditingRegisto(null);

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "SEARCH_GUEST", query: searchQuery })
          });
          const result = await response.json();

          if (result.status === "success") {
            setSearchResults(result.data || []);
            if (!result.data || result.data.length === 0) {
              alert('Nenhum registo encontrado com o termo pesquisado.');
            }
          }
        } catch (error) {
          alert('Erro ao realizar a pesquisa.');
        } finally {
          setSearching(false);
        }
      };

      const handleUpdateCheckout = async () => {
        if (!novaDataSaida || novaDataSaida <= editingRegisto.dataEntrada) {
          alert('A nova data de saída deve ser posterior à data de check-in.');
          return;
        }

        setUpdating(true);

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: "UPDATE_CHECKOUT",
              rowIndex: editingRegisto.rowIndex,
              newCheckout: novaDataSaida
            })
          });
          const result = await response.json();

          if (result.status === "success") {
            alert(`✅ Data de Check-out atualizada com sucesso para ${novaDataSaida}!`);
            setEditingRegisto(null);
            setSearchResults([]);
            setSearchQuery('');
          } else {
            alert('Erro ao atualizar: ' + result.message);
          }
        } catch (error) {
          alert('Erro ao ligar ao servidor.');
        } finally {
          setUpdating(false);
        }
      };

      const handleExportCSV = async (e) => {
        e.preventDefault();
        setExporting(true);

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: "EXPORT_CSV",
              startDate: exportDataInicio,
              endDate: exportDataFim
            })
          });

          const result = await response.json();

          if (result.status === "success") {
            const list = result.data;

            if (!list || list.length === 0) {
              alert(`Nenhum registo de hóspede estrangeiro encontrado entre ${exportDataInicio} e ${exportDataFim}.`);
              setExporting(false);
              return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "Nome_Completo,Data_Nascimento,Nacionalidade,Tipo_Documento,Numero_Documento,Pais_Emissor,Pais_Residencia,Data_Entrada,Data_Saida_Prevista\n";

            list.forEach(h => {
              const row = `"${h.nome}","${h.dataNascimento}","${h.nacionalidade}","${h.docTipo}","${h.docNumero}","${h.docPais}","${h.paisResidencia}","${h.dataEntrada}","${h.dataSaida}"`;
              csvContent += row + "\n";
            });

            const d = new Date();
            const timeStamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
            const nomeFicheiroCSV = `AIMA_${exportDataInicio}_a_${exportDataFim}_(${timeStamp}).csv`;

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", nomeFicheiroCSV);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            alert(`✅ Ficheiro .CSV gerado com sucesso! (${list.length} hóspede(s) estrangeiro(s) exportado(s)).`);
          } else {
            alert('Erro ao obter dados: ' + result.message);
          }
        } catch (error) {
          alert('❌ Erro ao comunicar com a base de dados. Tente novamente.');
        } finally {
          setExporting(false);
        }
      };

      const handlePrintBoletim = () => {
        if (!ultimoSucesso) return;

        const tituloOriginal = document.title;
        const nomeLimpo = ultimoSucesso.nome.trim().replace(/[^a-zA-Z0-9]/g, '_');
        const nomeFicheiroPDF = `Boletim_${ultimoSucesso.idBoletim}_${nomeLimpo}`;

        document.title = nomeFicheiroPDF;
        window.print();

        setTimeout(() => {
          document.title = tituloOriginal;
        }, 1000);
      };

      return (
        <div className="min-h-screen pb-12">
          {/* CABEÇALHO PRINCIPAL COM LOGIN INTEGRADO NO TOPO DIREITO */}
          <header className="bg-slate-900 text-white p-4 shadow-md">
            <div className="max-w-3xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-bold">🏠 Casa Velha</h1>
                  <button 
                    onClick={() => setShowSobreModal(true)}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] font-semibold px-2.5 py-1 rounded transition flex items-center gap-1"
                  >
                    ℹ️ Sobre
                  </button>
                </div>
                <p className="text-xs text-slate-400">Terminal de Check-in & AIMA (AL 166503/AL)</p>
              </div>

              {/* LOGIN DO FUNCIONÁRIO NO CANTO SUPERIOR DIREITO */}
              <div className="bg-slate-800 p-2.5 rounded-lg border border-slate-700 flex items-center gap-2 text-xs w-full md:w-auto">
                <span className="text-slate-400 font-semibold hidden sm:inline">👤 Receção:</span>
                
                {/* DROPDOWN DE NOME (ID OCULTO) */}
                <div className="flex-1 md:flex-initial">
                  {funcionarios.length > 0 ? (
                    <select 
                      value={selectedFuncObj.id || selectedFuncObj.nome}
                      onChange={e => {
                        const val = e.target.value;
                        const found = funcionarios.find(f => f.id === val || f.nome === val);
                        if (found) {
                          setSelectedFuncObj(found);
                        } else {
                          setSelectedFuncObj({ id: '', nome: val });
                        }
                      }}
                      className="w-full bg-slate-900 text-white border border-slate-600 rounded px-2 py-1 font-bold outline-none focus:ring-1 focus:ring-blue-500 text-xs"
                    >
                      {funcionarios.map(f => (
                        <option key={f.id || f.nome} value={f.id || f.nome}>
                          {f.nome}
                        </option>
                      ))}
                    </select>
                  ) : (
                    <input 
                      type="text" 
                      placeholder="Nome do Funcionário" 
                      value={selectedFuncObj.nome}
                      onChange={e => setSelectedFuncObj({ id: 'FUNC', nome: e.target.value })}
                      className="w-full bg-slate-900 text-white border border-slate-600 rounded px-2 py-1 font-bold text-xs"
                    />
                  )}
                </div>

                {/* PASS INATIVA */}
                <input 
                  type="password" 
                  placeholder="••••" 
                  value={passwordInativa} 
                  onChange={e => setPasswordInativa(e.target.value)} 
                  disabled
                  title="Palavra-passe (Desativada temporariamente)"
                  className="w-16 bg-slate-950 text-slate-600 border border-slate-700 rounded px-2 py-1 cursor-not-allowed text-xs text-center"
                />
              </div>
            </div>
          </header>

          <main className="max-w-3xl mx-auto p-4 mt-4 space-y-6">

            {/* PAINEL 1: PESQUISAR E ALTERAR CHECK-OUT PREVISTO */}
            <div className="bg-blue-50 p-5 rounded-xl border border-blue-200 shadow-sm space-y-3">
              <h2 className="text-sm font-bold text-blue-900">🔍 Pesquisar Hóspede / Alterar Data de Check-out</h2>
              <p className="text-xs text-blue-700">Utilize esta secção se o hóspede prolongar a estadia ou precisar de alterar a data de saída prevista.</p>

              <form onSubmit={handleSearch} className="flex gap-2 text-xs">
                <input 
                  type="text" 
                  placeholder="Pesquisar por N.º de Documento, Nome ou ID do Boletim..." 
                  value={searchQuery} 
                  onChange={e => setSearchQuery(e.target.value)} 
                  className="flex-1 border border-blue-300 p-2.5 rounded bg-white font-medium outline-none focus:ring-2 focus:ring-blue-500" 
                  required 
                />
                <button 
                  type="submit" 
                  disabled={searching}
                  className="bg-blue-700 hover:bg-blue-800 text-white font-bold px-4 rounded transition text-xs disabled:bg-slate-400"
                >
                  {searching ? 'A Pesquisar...' : 'Procurar'}
                </button>
              </form>

              {searchResults.length > 0 && (
                <div className="mt-3 bg-white rounded border border-blue-200 divide-y text-xs">
                  {searchResults.map(r => (
                    <div key={r.rowIndex} className="p-3 flex justify-between items-center">
                      <div>
                        <div className="font-bold text-slate-900">{r.nome} <span className="text-blue-600 font-mono">({r.idBoletim})</span></div>
                        <div className="text-slate-500">{r.docTipo}: {r.docNumero} | {r.tipoAlojamento} (Unidade {r.numeroUnidade})</div>
                        <div className="text-slate-700 font-medium">Entrada: {formatarDataLimpa(r.dataEntrada)} → Saída Atual: <span className="text-amber-700 font-bold">{formatarDataLimpa(r.dataSaida)}</span></div>
                      </div>
                      <button 
                        onClick={() => { setEditingRegisto(r); setNovaDataSaida(formatarDataLimpa(r.dataSaida)); }} 
                        className="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-3 py-1.5 rounded"
                      >
                        Alterar Check-out
                      </button>
                    </div>
                  ))}
                </div>
              )}

              {editingRegisto && (
                <div className="mt-3 p-4 bg-amber-100 rounded border border-amber-300 text-xs space-y-2">
                  <div className="font-bold text-amber-900">Alterar Saída Prevista para: {editingRegisto.nome}</div>
                  <div className="flex items-center gap-3">
                    <div>
                      <label className="block font-semibold text-amber-900 mb-1">Nova Data de Check-out Prevista:</label>
                      <input 
                        type="date" 
                        value={novaDataSaida} 
                        onChange={e => setNovaDataSaida(e.target.value)} 
                        className="border border-amber-400 p-2 rounded bg-white font-bold" 
                        required 
                      />
                    </div>
                    <button 
                      onClick={handleUpdateCheckout} 
                      disabled={updating}
                      className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded self-end disabled:bg-slate-400"
                    >
                      {updating ? 'A Guardar...' : '💾 Confirmar Nova Data'}
                    </button>
                    <button 
                      onClick={() => setEditingRegisto(null)} 
                      className="text-slate-600 hover:underline self-end py-2"
                    >
                      Cancelar
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* PAINEL 2: EXPORTAÇÃO .CSV */}
            <div className="bg-amber-50 p-5 rounded-xl border border-amber-200 shadow-sm space-y-3">
              <h2 className="text-sm font-bold text-amber-900">📥 Gerar & Descarregar Ficheiro .CSV para a AIMA</h2>
