<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ⚠️ COLE AQUI O SEU LINK DO GOOGLE APPS SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZitsCHoHUdgDwb2g8OrJEUm6tkXob-XhiywGuRt2ZAIPH9pwTWVvXGc2hQzA4psfbTg/exec";

    const TIPOS_ALOJAMENTO = [
      "Quarto Duplo com Vista Mar",
      "Quarto Triplo",
      "Estúdio",
      "Apartamento Dúplex"
    ];

    const MODOS_PAGAMENTO = [
      "Numerário",

      "MB",
      "Outro"
    ];

    const PAISES = [
      "Portugal", "Afeganistão", "África do Sul", "Albânia", "Alemanha", "Andorra", "Angola", "Antígua e Barbuda",
      "Arábia Saudita", "Argélia", "Argentina", "Arménia", "Austrália", "Áustria", "Azerbaijão", "Bahamas", "Bangladesh",
      "Barbados", "Barém", "Bélgica", "Belize", "Benim", "Bielorrússia", "Bolívia", "Bósnia e Herzegovina", "Botsuana",
      "Brasil", "Brunei", "Bulgária", "Burquina Faso", "Burundi", "Butão", "Cabo Verde", "Camarões", "Camboja", "Canadá",

      "Estónia", "Eswatini", "Estados Unidos", "Etiópia", "Fiji", "Filipinas", "Finlândia", "França", "Gabão", "Gâmbia",

      "Nicarágua", "Níger", "Nigéria", "Noruega", "Nova Zelândia", "Omã", "Palau", "Palestina", "Panamá", "Papua Nova Guiné",
      "Paquistão", "Paraguai", "Peru", "Polónia", "Quénia", "Quirguizistão", "Quiribati", "Reino Unido", "República Centro-Africana",
      "República Checa", "República Democrática do Congo", "República Dominicana", "Roménia", "Ruanda", "Rússia", "Samoa",
      "Santa Lúcia", "São Cristóvão e Neves", "São Marino", "São Tomé e Príncipe", "São Vicente e Granadinas", "Senegal",
      "Sérvia", "Seicheles", "Serra Leoa", "Singapura", "Síria", "Somália", "Sri Lanka", "Sudão", "Sudão do Sul", "Suécia",
      "Suíça", "Suriname", "Tailândia", "Tajiquistão", "Tanzânia", "Timor-Leste", "Togo", "Tonga", "Trindade e Tobago",
      "Tunísia", "Turquemenistão", "Turquia", "Tuvalu", "Ucrânia", "Uganda", "Uruguai", "Uzbequistão", "Vanuatu",
      "Vaticano", "Venezuela", "Vietname", "Zâmbia", "Zimbabué"
    ];

    const ANO_ATUAL = new Date().getFullYear();
    const ANOS_LISTA = Array.from({ length: ANO_ATUAL - 1920 + 1 }, (_, i) => ANO_ATUAL - i);
    const MESES_LISTA = [
      { num: '01', nome: 'Janeiro' }, { num: '02', nome: 'Fevereiro' }, { num: '03', nome: 'Março' },
      { num: '04', nome: 'Abril' }, { num: '05', nome: 'Maio' }, { num: '06', nome: 'Junho' },
      { num: '07', nome: 'Julho' }, { num: '08', nome: 'Agosto' }, { num: '09', nome: 'Setembro' },
      { num: '10', nome: 'Outubro' }, { num: '11', nome: 'Novembro' }, { num: '12', nome: 'Dezembro' }
    ];

    function CheckInAIMA() {
      const [loading, setLoading] = useState(false);
      const [exporting, setExporting] = useState(false);
      
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [searching, setSearching] = useState(false);
      const [editingRegisto, setEditingRegisto] = useState(null);
      const [novaDataSaida, setNovaDataSaida] = useState('');
      const [updating, setUpdating] = useState(false);

      const [idadeCalculada, setIdadeCalculada] = useState(null);
      const [ultimoSucesso, setUltimoSucesso] = useState(null);
      
      const [showSobreModal, setShowSobreModal] = useState(false);
      const [showBoletimForm, setShowBoletimForm] = useState(true);

      // Estado para Deteção de Hóspede Recorrente
      const [alertaRecorrente, setAlertaRecorrente] = useState(null);
      const [verificandoDoc, setVerificandoDoc] = useState(false);

      // Estado do Operador / Receção
      const [funcionarios, setFuncionarios] = useState([]);
      const [selectedFuncObj, setSelectedFuncObj] = useState({ id: '', nome: '' });
      const [passwordInativa, setPasswordInativa] = useState('');

      const [nasceAno, setNasceAno] = useState('');
      const [nasceMes, setNasceMes] = useState('01');
      const [nasceDia, setNasceDia] = useState('01');

      const [novoBoletim, setNovoBoletim] = useState({
        nome: '',
        dataNascimento: '',
        nacionalidade: 'Portugal',
        docTipo: 'Cartão de Cidadão / BI',
        docNumero: '',
        docPais: 'Portugal',
        paisResidencia: 'Portugal',
        dataEntrada: new Date().toISOString().slice(0, 10),
        dataSaida: '',
        tipoAlojamento: 'Quarto Duplo com Vista Mar',
        numeroUnidade: '1',
        eMenor: 'Não',
        titularDoc: 'Próprio',
        qualidadeAcompanhante: 'N/A',
        valorReserva: '',
        taxaTuristica: '',
        modoPagamento: 'Numerário'
      });

      const todayStr = new Date().toISOString().slice(0, 10);
      const [exportDataInicio, setExportDataInicio] = useState(todayStr);
      const [exportDataFim, setExportDataFim] = useState(todayStr);

      // Cálculo dinâmico do número de noites
      const [numeroNoites, setNumeroNoites] = useState(0);

      const calcularDiferencaNoites = (d1Str, d2Str) => {
        if (!d1Str || !d2Str) return 0;
        const dIn = new Date(d1Str);
        const dOut = new Date(d2Str);
        const diffTime = dOut - dIn;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays > 0 ? diffDays : 0;
      };

      useEffect(() => {
        setNumeroNoites(calcularDiferencaNoites(novoBoletim.dataEntrada, novoBoletim.dataSaida));
      }, [novoBoletim.dataEntrada, novoBoletim.dataSaida]);

      useEffect(() => {
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: "GET_EMPLOYEES" })
        })
        .then(res => res.json())
        .then(res => {
          if (res.status === "success" && res.data && res.data.length > 0) {
            setFuncionarios(res.data);
            setSelectedFuncObj(res.data[0]);
          }
        })
        .catch(() => {});
      }, []);

      // Deteção Automática de Hóspede Recorrente ao digitar o número de documento
      useEffect(() => {
        const docLimpo = novoBoletim.docNumero.trim();
        if (docLimpo.length < 4) {
          setAlertaRecorrente(null);
          return;
        }

        const timer = setTimeout(async () => {
          setVerificandoDoc(true);
          try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: "SEARCH_GUEST", query: docLimpo })
            });
            const result = await response.json();

            if (result.status === "success" && result.data && result.data.length > 0) {
              const ultimoRegisto = result.data[result.data.length - 1]; // Obtém o registo mais recente
              const totalEstadias = result.data.length;

              setAlertaRecorrente({
                nome: ultimoRegisto.nome,
                estadias: totalEstadias,
                ultimaEntrada: ultimoRegisto.dataEntrada
              });

              // Preenchimento Automático do Formulário com dados do último registo
              setNovoBoletim(prev => ({
                ...prev,
                nome: ultimoRegisto.nome || prev.nome,
                nacionalidade: ultimoRegisto.nacionalidade || prev.nacionalidade,
                docTipo: ultimoRegisto.docTipo || prev.docTipo,
                docPais: ultimoRegisto.docPais || prev.docPais,
                paisResidencia: ultimoRegisto.paisResidencia || prev.paisResidencia
              }));

              // Se existir data de nascimento válida, ajusta os selectores
              if (ultimoRegisto.dataNascimento) {
                const dClean = String(ultimoRegisto.dataNascimento).slice(0, 10);
                const parts = dClean.split('-');
                if (parts.length === 3) {
                  setNasceAno(parts[0]);
                  setNasceMes(parts[1]);
                  setNasceDia(parts[2]);
                  setNovoBoletim(prev => ({ ...prev, dataNascimento: dClean }));
                }
              }
            } else {
              setAlertaRecorrente(null);
            }
          } catch (e) {
            // Silencioso em caso de erro de rede temporário
          } finally {
            setVerificandoDoc(false);
          }
        }, 600); // Aguarda 600ms após o utilizador parar de digitar

        return () => clearTimeout(timer);
      }, [novoBoletim.docNumero]);

      const handleSelectNascimento = (ano, mes, dia) => {
        setNasceAno(ano);
        setNasceMes(mes);
        setNasceDia(dia);

        if (ano && mes && dia) {
          const formattedDate = `${ano}-${mes}-${String(dia).padStart(2, '0')}`;
          setNovoBoletim(prev => ({ ...prev, dataNascimento: formattedDate }));
        }
      };

      useEffect(() => {
        if (!novoBoletim.dataNascimento) {
          setIdadeCalculada(null);
          setNovoBoletim(prev => ({ ...prev, eMenor: 'Não', titularDoc: 'Próprio', qualidadeAcompanhante: 'N/A' }));
          return;
        }

        const nascimento = new Date(novoBoletim.dataNascimento);
        const hoje = new Date(novoBoletim.dataEntrada || todayStr);
        
        let idade = hoje.getFullYear() - nascimento.getFullYear();
        const m = hoje.getMonth() - nascimento.getMonth();
        if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) {
          idade--;
        }

        if (!isNaN(idade)) {
          setIdadeCalculada(idade);
          if (idade < 18) {
            setNovoBoletim(prev => ({
              ...prev,
              eMenor: 'Sim',
              titularDoc: prev.titularDoc === 'Próprio' ? 'Documento do Acompanhante' : prev.titularDoc,
              qualidadeAcompanhante: prev.qualidadeAcompanhante === 'N/A' ? 'Pai / Mãe' : prev.qualidadeAcompanhante
            }));
          } else {
            setNovoBoletim(prev => ({
              ...prev,
              eMenor: 'Não',
              titularDoc: 'Próprio',
              qualidadeAcompanhante: 'N/A'
            }));
          }
        }
      }, [novoBoletim.dataNascimento, novoBoletim.dataEntrada]);

      const formatarDataLimpa = (dStr) => {
        if (!dStr) return '';
        const str = String(dStr).trim();
        if (str.length >= 10 && str.match(/^\d{4}-\d{2}-\d{2}/)) {
          return str.slice(0, 10);
        }
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          return d.toISOString().slice(0, 10);
        }
        return str.slice(0, 10);
      };

      const gerarIDBoletim = () => {
        const d = new Date();
        const datePart = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        const randomPart = Math.floor(1000 + Math.random() * 9000);
        return `CV-${datePart}-${randomPart}`;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();

        if (!novoBoletim.dataNascimento) {
          alert('Por favor selecione o Ano, Mês e Dia de Nascimento.');
          return;
        }

        if (novoBoletim.dataSaida <= novoBoletim.dataEntrada) {
          alert('A data de check-out prevista deve ser posterior à data de check-in.');
          return;
        }

        setLoading(true);

        const idBoletim = gerarIDBoletim();
        const funcionarioString = selectedFuncObj.id 
          ? `[${selectedFuncObj.id}] ${selectedFuncObj.nome}` 
          : selectedFuncObj.nome;

        const payload = { 
          ...novoBoletim, 
          idBoletim, 
          funcionarioRececao: funcionarioString,
          funcionarioId: selectedFuncObj.id || '',
          funcionarioNome: selectedFuncObj.nome || funcionarioString,
          noitesCalculadas: numeroNoites
        };

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          setUltimoSucesso(payload);

          setNovoBoletim({
            nome: '',
            dataNascimento: '',
            nacionalidade: 'Portugal',
            docTipo: 'Cartão de Cidadão / BI',
            docNumero: '',
            docPais: 'Portugal',
            paisResidencia: 'Portugal',
            dataEntrada: new Date().toISOString().slice(0, 10),
            dataSaida: '',
            tipoAlojamento: novoBoletim.tipoAlojamento,
            numeroUnidade: novoBoletim.numeroUnidade,
            eMenor: 'Não',
            titularDoc: 'Próprio',
            qualidadeAcompanhante: 'N/A',
            valorReserva: '',
            taxaTuristica: '',
            modoPagamento: 'Numerário'
          });
          setNasceAno('');
          setIdadeCalculada(null);
          setAlertaRecorrente(null);
        } catch (error) {
          alert('❌ Erro ao ligar ao servidor. Verifique a ligação à internet.');
        } finally {
          setLoading(false);
        }
      };

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) return;

        setSearching(true);
        setEditingRegisto(null);

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "SEARCH_GUEST", query: searchQuery })
          });
          const result = await response.json();

          if (result.status === "success") {
            setSearchResults(result.data || []);
            if (!result.data || result.data.length === 0) {
              alert('Nenhum registo encontrado com o termo pesquisado.');
            }
          }
        } catch (error) {
          alert('Erro ao realizar a pesquisa.');
        } finally {
          setSearching(false);
        }
      };

      const handleUpdateCheckout = async () => {
        if (!novaDataSaida || novaDataSaida <= editingRegisto.dataEntrada) {
          alert('A nova data de saída deve ser posterior à data de check-in.');
          return;
        }

        setUpdating(true);

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: "UPDATE_CHECKOUT",
              rowIndex: editingRegisto.rowIndex,
              newCheckout: novaDataSaida
            })
          });
          const result = await response.json();

          if (result.status === "success") {
            alert(`✅ Data de Check-out atualizada com sucesso para ${novaDataSaida}!`);
            setEditingRegisto(null);
            setSearchResults([]);
            setSearchQuery('');
          } else {
            alert('Erro ao atualizar: ' + result.message);
          }
        } catch (error) {
          alert('Erro ao ligar ao servidor.');
        } finally {
          setUpdating(false);
        }
      };

      const handlePrintFromSearch = (r) => {
        const dEntrada = formatarDataLimpa(r.dataEntrada);
        const dSaida = formatarDataLimpa(r.dataSaida);
        const noites = calcularDiferencaNoites(dEntrada, dSaida);

        const payloadFromSearch = {
          idBoletim: r.idBoletim,
          nome: r.nome,
          dataNascimento: formatarDataLimpa(r.dataNascimento),
          nacionalidade: r.nacionalidade || 'Portugal',
          paisResidencia: r.paisResidencia || 'Portugal',
          docTipo: r.docTipo || 'Cartão de Cidadão / BI',
          docNumero: r.docNumero || '',
          docPais: r.docPais || 'Portugal',
          tipoAlojamento: r.tipoAlojamento,
          numeroUnidade: r.numeroUnidade,
          dataEntrada: dEntrada,
          dataSaida: dSaida,
          noitesCalculadas: noites,
          eMenor: r.eMenor || 'Não',
          titularDoc: r.titularDoc || 'Próprio',
          qualidadeAcompanhante: r.qualidadeAcompanhante || 'N/A',
          valorReserva: r.valorReserva || '',
          taxaTuristica: r.taxaTuristica || '',
          modoPagamento: r.modoPagamento || 'Numerário',
          funcionarioNome: r.funcionarioRececao || selectedFuncObj.nome,
          funcionarioId: selectedFuncObj.id || ''
        };
        setUltimoSucesso(payloadFromSearch);
      };

      const handleExportCSV = async (e) => {
        e.preventDefault();
        setExporting(true);

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: "EXPORT_CSV",
              startDate: exportDataInicio,
              endDate: exportDataFim
            })
          });

          const result = await response.json();

          if (result.status === "success") {
            const list = result.data;

            if (!list || list.length === 0) {
              alert(`Nenhum registo de hóspede estrangeiro encontrado entre ${exportDataInicio} e ${exportDataFim}.`);
              setExporting(false);
              return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "Nome_Completo,Data_Nascimento,Nacionalidade,Tipo_Documento,Numero_Documento,Pais_Emissor,Pais_Residencia,Data_Entrada,Data_Saida_Prevista\n";

            list.forEach(h => {
              const row = `"${h.nome}","${h.dataNascimento}","${h.nacionalidade}","${h.docTipo}","${h.docNumero}","${h.docPais}","${h.paisResidencia}","${h.dataEntrada}","${h.dataSaida}"`;
              csvContent += row + "\n";
            });

            const d = new Date();
            const timeStamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
            const nomeFicheiroCSV = `AIMA_${exportDataInicio}_a_${exportDataFim}_(${timeStamp}).csv`;

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", nomeFicheiroCSV);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            alert(`✅ Ficheiro .CSV gerado com sucesso! (${list.length} hóspede(s) estrangeiro(s) exportado(s)).`);
          } else {
            alert('Erro ao obter dados: ' + result.message);
          }
        } catch (error) {
          alert('❌ Erro ao comunicar com a base de dados. Tente novamente.');
        } finally {
          setExporting(false);
        }
      };

      const handlePrintBoletim = () => {
        if (!ultimoSucesso) return;

        const tituloOriginal = document.title;
        const nomeLimpo = (ultimoSucesso.nome || 'Hospede').trim().replace(/[^a-zA-Z0-9]/g, '_');
        const nomeFicheiroPDF = `Boletim_${ultimoSucesso.idBoletim}_${nomeLimpo}`;

        document.title = nomeFicheiroPDF;
        window.print();

        setTimeout(() => {
          document.title = tituloOriginal;
        }, 1000);
      };

      return (
        <div className="min-h-screen pb-12">
          {/* CABEÇALHO PRINCIPAL COM LOGIN INTEGRADO NO TOPO DIREITO */}
          <header className="bg-slate-900 text-white p-4 shadow-md">
            <div className="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-bold">🏠 Casa Velha</h1>
                  <button 
                    onClick={() => setShowSobreModal(true)}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] font-semibold px-2.5 py-1 rounded transition flex items-center gap-1"
                  >
                    ℹ️ Sobre
                  </button>
                </div>
                <p className="text-xs text-slate-400">Terminal de Check-in (RNAL 166503/AL)</p>
              </div>

              {/* LOGIN DO FUNCIONÁRIO NO CANTO SUPERIOR DIREITO */}
              <div className="bg-slate-800 p-2.5 rounded-lg border border-slate-700 flex items-center gap-2 text-xs w-full md:w-auto">
                <span className="text-slate-400 font-semibold hidden sm:inline">👤 Receção:</span>
                
                <div className="flex-1 md:flex-initial">
                  {funcionarios.length > 0 ? (
                    <select 
                      value={selectedFuncObj.id || selectedFuncObj.nome}
                      onChange={e => {
                        const val = e.target.value;
                        const found = funcionarios.find(f => f.id === val || f.nome === val);
                        if (found) {
                          setSelectedFuncObj(found);
                        } else {
                          setSelectedFuncObj({ id: '', nome: val });
                        }
                      }}
                      className="w-full md:w-60 bg-slate-900 text-white border border-slate-600 rounded px-2 py-1.5 font-bold outline-none focus:ring-1 focus:ring-blue-500 text-xs"
                    >
                      {funcionarios.map(f => (

                <div className="text-center border-b pb-3">
                  <h2 className="text-lg font-bold text-slate-900">🏠 Casa Velha</h2>
                  <p className="text-xs text-slate-500">Informação Legal & Registo de Alojamento Local</p>
                </div>

                <div className="space-y-3 text-xs text-slate-700">
                  <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-2">
                    <div className="flex justify-between">
                      <span className="text-slate-500">Registo RNAL:</span>
                      <strong className="text-slate-900 font-mono">166503/AL</strong>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Data de Registo RNAL:</span>
                      <strong className="text-slate-900">21-06-2025</strong>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Abertura ao Público:</span>
                      <strong className="text-slate-900">23-02-2018</strong>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Título Autorização Utilização:</span>
                      <strong className="text-slate-900 font-mono">N.º 63/18</strong>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Registo Oficial INE:</span>
                      <strong className="text-slate-900">Sim</strong>
                    </div>
                  </div>
                </div>

                <div className="pt-2">
                  <button 
                    onClick={() => setShowSobreModal(false)}
                    className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-lg transition text-xs"
                  >
                    Fechar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE SUCESSO & IMPRESSÃO CORRIGIDA */}
          {ultimoSucesso && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-slate-200">
                
                {/* ÁREA IMPRESSA (PDF) */}
                <div id="printable-boletim" className="space-y-4 text-xs font-sans text-slate-800 p-2">
                  <div className="text-center border-b pb-3">
                    <h2 className="text-base font-bold text-slate-900">🏠 Casa Velha - Comprovativo de Check-in</h2>
                    <p className="text-[11px] text-slate-500">Boletim de Alojamento (RNAL n.º 166503/AL)</p>
                    <span className="inline-block mt-1 font-mono font-bold bg-blue-100 text-blue-900 px-2 py-0.5 rounded text-xs">
                      ID Boletim: {ultimoSucesso.idBoletim}
                    </span>
                  </div>

                  <div className="space-y-2 border-b pb-3">
                    <div><strong className="text-slate-600">Hóspede:</strong> {ultimoSucesso.nome}</div>
                    <div>
                      <strong className="text-slate-600">Data de Nascimento:</strong> {ultimoSucesso.dataNascimento || 'N/A'} ({ultimoSucesso.eMenor === 'Sim' ? 'Menor' : 'Adulto'})
                    </div>
                    <div>
                      <strong className="text-slate-600">Nacionalidade:</strong> {ultimoSucesso.nacionalidade || 'Portugal'} | <strong className="text-slate-600">Residência:</strong> {ultimoSucesso.paisResidencia || 'Portugal'}
                    </div>
                    <div>
                      <strong className="text-slate-600">Documento:</strong> {ultimoSucesso.docTipo || 'Documento'} N.º {ultimoSucesso.docNumero} {ultimoSucesso.docPais && ultimoSucesso.docPais !== 'Portugal' ? `(${ultimoSucesso.docPais})` : ''}
                    </div>
                    {ultimoSucesso.eMenor === 'Sim' && (
                      <div className="p-2 bg-purple-50 rounded border border-purple-200">
                        <strong>Informação de Menor:</strong> {ultimoSucesso.titularDoc} | Acompanhante: {ultimoSucesso.qualidadeAcompanhante}
                      </div>
                    )}
                  </div>

                  <div className="space-y-1 border-b pb-3">
                    <div><strong className="text-slate-600">Alojamento:</strong> {ultimoSucesso.tipoAlojamento} (Unidade {ultimoSucesso.numeroUnidade})</div>
                    <div className="flex justify-between items-center pr-2">
                      <div>
                        <strong className="text-slate-600">Check-in:</strong> {formatarDataLimpa(ultimoSucesso.dataEntrada)} → <strong className="text-slate-600">Check-out Previsto:</strong> {formatarDataLimpa(ultimoSucesso.dataSaida)}
                      </div>
                      {ultimoSucesso.noitesCalculadas > 0 && (
                        <span className="font-bold text-blue-900 bg-blue-50 px-2 py-0.5 rounded border border-blue-200 text-[11px]">
                          {ultimoSucesso.noitesCalculadas} {ultimoSucesso.noitesCalculadas === 1 ? 'noite' : 'noites'}
                        </span>
                      )}
                    </div>
                  </div>

                  {/* INFORMAÇÃO DE PAGAMENTO NA IMPRESSÃO */}
                  <div className="p-3 bg-emerald-50 rounded-lg border border-emerald-200 space-y-1.5 font-medium text-emerald-900">
                    <div className="font-bold border-b border-emerald-200 pb-1 text-[11px]">💳 Detalhes do Pagamento:</div>
                    <div className="flex justify-between">
                      <span>Valor da Reserva: <strong>{ultimoSucesso.valorReserva ? `${ultimoSucesso.valorReserva} €` : '0.00 €'}</strong></span>
                      <span>Taxa Turística: <strong>{ultimoSucesso.taxaTuristica ? `${ultimoSucesso.taxaTuristica} €` : '0.00 €'}</strong></span>
                    </div>
                    <div>Modo de Pagamento: <strong>{ultimoSucesso.modoPagamento || 'Numerário'}</strong></div>
                  </div>

                  {/* IDENTIFICAÇÃO APENAS DO ID DO FUNCIONÁRIO NO RODAPÉ */}
                  <div className="pt-2 text-right border-t border-slate-200">
                    <div className="text-[10px] text-slate-500 font-mono">
                      {ultimoSucesso.funcionarioId && ultimoSucesso.funcionarioId !== 'N/A' 
                        ? `(ID: ${ultimoSucesso.funcionarioId})` 
                        : (ultimoSucesso.funcionarioNome || '')}
                    </div>
                  </div>
                </div>

                <div className="flex gap-3 pt-2 border-t">
                  <button 
                    onClick={handlePrintBoletim}
                    className="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-lg transition text-xs flex items-center justify-center gap-1.5"
                  >
                    🖨️ Imprimir Boletim (PDF / Papel)
                  </button>
                  <button 
                    onClick={() => setUltimoSucesso(null)}
                    className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold px-4 py-2.5 rounded-lg transition text-xs"
                  >
                    Fechar
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CheckInAIMA />);
  </script>
</body>
</html>
