<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Velha - Terminal de Check-in & AIMA</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-boletim, #printable-boletim * { visibility: visible; }
      #printable-boletim { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ⚠️ COLE AQUI O SEU LINK DO GOOGLE APPS SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZitsCHoHUdgDwb2g8OrJEUm6tkXob-XhiywGuRt2ZAIPH9pwTWVvXGc2hQzA4psfbTg/exec";

    const TIPOS_ALOJAMENTO = [
      "Quarto Duplo com Vista Mar",
      "Quarto Triplo",
      "Estúdio",
      "Apartamento Dúplex"
    ];

    const PAISES = [
      "Espanha", "Alemanha", "França", "Reino Unido", "Itália", "Holanda", "Brasil", "Estados Unidos",
      "Afeganistão", "África do Sul", "Albânia", "Andorra", "Angola", "Antígua e Barbuda", "Arábia Saudita", 
      "Argélia", "Argentina", "Arménia", "Austrália", "Áustria", "Azerbaijão", "Bahamas", "Bangladesh", 
      "Barbados", "Barém", "Bélgica", "Belize", "Benim", "Bielorrússia", "Bolívia", "Bósnia e Herzegovina", 
      "Botsuana", "Brunei", "Bulgária", "Burquina Faso", "Burundi", "Butão", "Cabo Verde", "Camarões", 
      "Camboja", "Canadá", "Catar", "Cazaquistão", "Chade", "Chile", "China", "Chipre", "Colômbia", 
      "Comores", "Congo-Brazzaville", "Coreia do Norte", "Coreia do Sul", "Costa do Marfim", "Costa Rica", 
      "Croácia", "Cuaite", "Cuba", "Dinamarca", "Dominica", "Egipto", "Emirados Árabes Unidos", "Equador", 
      "Eritreia", "Eslováquia", "Eslovénia", "Estónia", "Eswatini", "Etiópia", "Fiji", "Filipinas", 
      "Finlândia", "Gabão", "Gâmbia", "Gana", "Geórgia", "Granada", "Grécia", "Guatemala", "Guiana", 
      "Guiné", "Guiné Equatorial", "Guiné-Bissau", "Haiti", "Honduras", "Hungria", "Iémen", "Ilhas Marshall", 
      "Ilhas Salomão", "Índia", "Indonésia", "Irão", "Iraque", "Irlanda", "Islândia", "Israel", "Jamaica", 
      "Japão", "Jordânia", "Ciribati", "Kowait", "Laos", "Lesoto", "Letónia", "Líbano", "Libéria", "Líbia", 
      "Liechtenstein", "Lituânia", "Luxemburgo", "Macedónia do Norte", "Madagáscar", "Malásia", "Maláui", 
      "Maldivas", "Mali", "Malta", "Marrocos", "Maurícia", "Mauritânia", "México", "Mianmar", "Micronésia", 
      "Moçambique", "Moldávia", "Mónaco", "Mongólia", "Montenegro", "Namíbia", "Nauru", "Nepal", "Nicarágua", 
      "Níger", "Nigéria", "Noruega", "Nova Zelândia", "Omã", "Palau", "Palestina", "Panamá", "Papua Nova Guiné", 
      "Paquistão", "Paraguai", "Peru", "Polónia", "Quénia", "Quirguizistão", "Quiribati", "República Centro-Africana", 
      "República Checa", "República Democrática do Congo", "República Dominicana", "Roménia", "Ruanda", "Rússia", 
      "Samoa", "Santa Lúcia", "São Cristóvão e Neves", "São Marino", "São Tomé e Príncipe", "São Vicente e Granadinas", 
      "Senegal", "Sérvia", "Seicheles", "Serra Leoa", "Singapura", "Síria", "Somália", "Sri Lanka", "Sudão", 
      "Sudão do Sul", "Suécia", "Suíça", "Suriname", "Tailândia", "Tajiquistão", "Tanzânia", "Timor-Leste", 
      "Togo", "Tonga", "Trindade e Tobago", "Tunísia", "Turquemenistão", "Turquia", "Tuvalu", "Ucrânia", 
      "Uganda", "Uruguai", "Uzbequistão", "Vanuatu", "Vaticano", "Venezuela", "Vietname", "Zâmbia", "Zimbabué"
    ];

    function CheckInAIMA() {
      const [loading, setLoading] = useState(false);
      const [exporting, setExporting] = useState(false);
      
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [searching, setSearching] = useState(false);
      const [editingRegisto, setEditingRegisto] = useState(null);
      const [novaDataSaida, setNovaDataSaida] = useState('');
      const [updating, setUpdating] = useState(false);

      const [idadeCalculada, setIdadeCalculada] = useState(null);
      const [ultimoSucesso, setUltimoSucesso] = useState(null);

      const [novoBoletim, setNovoBoletim] = useState({
        nome: '',
        dataNascimento: '',
        nacionalidade: 'Espanha',
        docTipo: 'Passaporte',
        docNumero: '',
        docPais: 'Espanha',
        paisResidencia: 'Espanha',
        dataEntrada: new Date().toISOString().slice(0, 10),
        dataSaida: '',
        tipoAlojamento: 'Quarto Duplo com Vista Mar',
        numeroUnidade: '1',
        eMenor: 'Não',
        titularDoc: 'Próprio',
        qualidadeAcompanhante: 'N/A'
      });

      const todayStr = new Date().toISOString().slice(0, 10);
      const [exportDataInicio, setExportDataInicio] = useState(todayStr);
      const [exportDataFim, setExportDataFim] = useState(todayStr);

      useEffect(() => {
        if (!novoBoletim.dataNascimento) {
          setIdadeCalculada(null);
          setNovoBoletim(prev => ({ ...prev, eMenor: 'Não', titularDoc: 'Próprio', qualidadeAcompanhante: 'N/A' }));
          return;
        }

        const nascimento = new Date(novoBoletim.dataNascimento);
        const hoje = new Date(novoBoletim.dataEntrada || todayStr);
        
        let idade = hoje.getFullYear() - nascimento.getFullYear();
        const m = hoje.getMonth() - nascimento.getMonth();
        if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) {
          idade--;
        }

        if (!isNaN(idade)) {
          setIdadeCalculada(idade);
          if (idade < 18) {
            setNovoBoletim(prev => ({
              ...prev,
              eMenor: 'Sim',
              titularDoc: prev.titularDoc === 'Próprio' ? 'Documento do Acompanhante' : prev.titularDoc,
              qualidadeAcompanhante: prev.qualidadeAcompanhante === 'N/A' ? 'Pai / Mãe' : prev.qualidadeAcompanhante
            }));
          } else {
            setNovoBoletim(prev => ({
              ...prev,
              eMenor: 'Não',
              titularDoc: 'Próprio',
              qualidadeAcompanhante: 'N/A'
            }));
          }
        }
      }, [novoBoletim.dataNascimento, novoBoletim.dataEntrada]);

      const formatarDataLimpa = (dStr) => {
        if (!dStr) return '';
        return String(dStr).slice(0, 10);
      };

      const gerarIDBoletim = () => {
        const d = new Date();
        const datePart = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        const randomPart = Math.floor(1000 + Math.random() * 9000);
        return `CV-${datePart}-${randomPart}`;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();

        if (novoBoletim.dataSaida <= novoBoletim.dataEntrada) {
          alert('A data de check-out prevista deve ser posterior à data de check-in.');
          return;
        }

        setLoading(true);

        const idBoletim = gerarIDBoletim();
        const payload = { ...novoBoletim, idBoletim };

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          // Guarda dados para impressão e exibe o modal
          setUltimoSucesso(payload);

          setNovoBoletim({
            nome: '',
            dataNascimento: '',
            nacionalidade: 'Espanha',
            docTipo: 'Passaporte',
            docNumero: '',
            docPais: 'Espanha',
            paisResidencia: 'Espanha',
            dataEntrada: new Date().toISOString().slice(0, 10),
            dataSaida: '',
            tipoAlojamento: novoBoletim.tipoAlojamento,
            numeroUnidade: novoBoletim.numeroUnidade,
            eMenor: 'Não',
            titularDoc: 'Próprio',
            qualidadeAcompanhante: 'N/A'
          });
          setIdadeCalculada(null);
        } catch (error) {
          alert('❌ Erro ao ligar ao servidor. Verifique a ligação à internet.');
        } finally {
          setLoading(false);
        }
      };

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) return;

        setSearching(true);
        setEditingRegisto(null);

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "SEARCH_GUEST", query: searchQuery })
          });
          const result = await response.json();

          if (result.status === "success") {
            setSearchResults(result.data || []);
            if (!result.data || result.data.length === 0) {
              alert('Nenhum registo encontrado com o termo pesquisado.');
            }
          }
        } catch (error) {
          alert('Erro ao realizar a pesquisa.');
        } finally {
          setSearching(false);
        }
      };

      const handleUpdateCheckout = async () => {
        if (!novaDataSaida || novaDataSaida <= editingRegisto.dataEntrada) {
          alert('A nova data de saída deve ser posterior à data de check-in.');
          return;
        }

        setUpdating(true);

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: "UPDATE_CHECKOUT",
              rowIndex: editingRegisto.rowIndex,
              newCheckout: novaDataSaida
            })
          });
          const result = await response.json();

          if (result.status === "success") {
            alert(`✅ Data de Check-out atualizada com sucesso para ${novaDataSaida}!`);
            setEditingRegisto(null);
            setSearchResults([]);
            setSearchQuery('');
          } else {
            alert('Erro ao atualizar: ' + result.message);
          }
        } catch (error) {
          alert('Erro ao ligar ao servidor.');
        } finally {
          setUpdating(false);
        }
      };

      const handleExportCSV = async (e) => {
        e.preventDefault();
        setExporting(true);

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: "EXPORT_CSV",
              startDate: exportDataInicio,
              endDate: exportDataFim
            })
          });

          const result = await response.json();

          if (result.status === "success") {
            const list = result.data;

            if (!list || list.length === 0) {
              alert(`Nenhum registo de hóspede encontrado entre ${exportDataInicio} e ${exportDataFim}.`);
              setExporting(false);
              return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Nome_Completo,Data_Nascimento,Nacionalidade,Tipo_Documento,Numero_Documento,Pais_Emissor,Pais_Residencia,Data_Entrada,Data_Saida_Prevista\n";

            list.forEach(h => {
              const row = `"${h.nome}","${h.dataNascimento}","${h.nacionalidade}","${h.docTipo}","${h.docNumero}","${h.docPais}","${h.paisResidencia}","${h.dataEntrada}","${h.dataSaida}"`;
              csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Boletins_AIMA_SIBA_CasaVelha_${exportDataInicio}_a_${exportDataFim}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            alert(`✅ Ficheiro .CSV gerado com sucesso! (${list.length} hóspede(s) exportado(s)).`);
          } else {
            alert('Erro ao obter dados: ' + result.message);
          }
        } catch (error) {
          alert('❌ Erro ao comunicar com a base de dados. Tente novamente.');
        } finally {
          setExporting(false);
        }
      };

      return (
        <div className="min-h-screen pb-12">
          <header className="bg-slate-900 text-white p-4 shadow-md">
            <div className="max-w-3xl mx-auto">
              <h1 className="text-xl font-bold">🏠 Casa Velha - Terminal de Check-in</h1>
              <p className="text-xs text-slate-400">Registo Oficial de Boletins de Alojamento (AIMA / SIBA)</p>
            </div>
          </header>

          <main className="max-w-3xl mx-auto p-4 mt-4 space-y-6">
            
            {/* PAINEL 1: PESQUISAR E ALTERAR CHECK-OUT PREVISTO */}
            <div className="bg-blue-50 p-5 rounded-xl border border-blue-200 shadow-sm space-y-3">
              <h2 className="text-sm font-bold text-blue-900">🔍 Pesquisar Hóspede / Alterar Data de Check-out</h2>
              <p className="text-xs text-blue-700">Utilize esta secção se o hóspede prolongar a estadia ou precisar de alterar a data de saída prevista.</p>

              <form onSubmit={handleSearch} className="flex gap-2 text-xs">
                <input 
                  type="text" 
                  placeholder="Pesquisar por N.º de Documento, Nome ou ID do Boletim..." 
                  value={searchQuery} 
                  onChange={e => setSearchQuery(e.target.value)} 
                  className="flex-1 border border-blue-300 p-2.5 rounded bg-white font-medium outline-none focus:ring-2 focus:ring-blue-500" 
                  required 
                />
                <button 
                  type="submit" 
                  disabled={searching}
                  className="bg-blue-700 hover:bg-blue-800 text-white font-bold px-4 rounded transition text-xs disabled:bg-slate-400"
                >
                  {searching ? 'A Pesquisar...' : 'Procurar'}
                </button>
              </form>

              {searchResults.length > 0 && (
                <div className="mt-3 bg-white rounded border border-blue-200 divide-y text-xs">
                  {searchResults.map(r => (
                    <div key={r.rowIndex} className="p-3 flex justify-between items-center">
                      <div>
                        <div className="font-bold text-slate-900">{r.nome} <span className="text-blue-600 font-mono">({r.idBoletim})</span></div>
                        <div className="text-slate-500">{r.docTipo}: {r.docNumero} | {r.tipoAlojamento} (Unidade {r.numeroUnidade})</div>
                        <div className="text-slate-700 font-medium">Entrada: {formatarDataLimpa(r.dataEntrada)} → Saída Atual: <span className="text-amber-700 font-bold">{formatarDataLimpa(r.dataSaida)}</span></div>
                      </div>
                      <button 
                        onClick={() => { setEditingRegisto(r); setNovaDataSaida(formatarDataLimpa(r.dataSaida)); }} 
                        className="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-3 py-1.5 rounded"
                      >
                        Alterar Check-out
                      </button>
                    </div>
                  ))}
                </div>
              )}

              {editingRegisto && (
                <div className="mt-3 p-4 bg-amber-100 rounded border border-amber-300 text-xs space-y-2">
                  <div className="font-bold text-amber-900">Alterar Saída Prevista para: {editingRegisto.nome}</div>
                  <div className="flex items-center gap-3">
                    <div>
                      <label className="block font-semibold text-amber-900 mb-1">Nova Data de Check-out Prevista:</label>
                      <input 
                        type="date" 
                        value={novaDataSaida} 
                        onChange={e => setNovaDataSaida(e.target.value)} 
                        className="border border-amber-400 p-2 rounded bg-white font-bold" 
                        required 
                      />
                    </div>
                    <button 
                      onClick={handleUpdateCheckout} 
                      disabled={updating}
                      className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded self-end disabled:bg-slate-400"
                    >
                      {updating ? 'A Guardar...' : '💾 Confirmar Nova Data'}
                    </button>
                    <button 
                      onClick={() => setEditingRegisto(null)} 
                      className="text-slate-600 hover:underline self-end py-2"
                    >
                      Cancelar
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* PAINEL 2: EXPORTAÇÃO .CSV */}
            <div className="bg-amber-50 p-5 rounded-xl border border-amber-200 shadow-sm space-y-3">
              <h2 className="text-sm font-bold text-amber-900">📥 Gerar & Descarregar Ficheiro .CSV para a AIMA</h2>
              
              <form onSubmit={handleExportCSV} className="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end text-xs">
                <div>
                  <label className="block font-semibold text-amber-900 mb-1">Data Início Check-in</label>
                  <input 
                    type="date" 
                    value={exportDataInicio} 
                    onChange={e => setExportDataInicio(e.target.value)} 
                    className="w-full border border-amber-300 p-2 rounded bg-white font-medium" 
                    required 
                  />
                </div>
                <div>
                  <label className="block font-semibold text-amber-900 mb-1">Data Fim Check-in</label>
                  <input 
                    type="date" 
                    value={exportDataFim} 
                    onChange={e => setExportDataFim(e.target.value)} 
                    className="w-full border border-amber-300 p-2 rounded bg-white font-medium" 
                    required 
                  />
                </div>
                <button 
                  type="submit" 
                  disabled={exporting}
                  className="bg-amber-700 hover:bg-amber-800 text-white font-bold p-2.5 rounded transition shadow text-xs flex items-center justify-center gap-1 disabled:bg-slate-400"
                >
                  {exporting ? 'A Gerar .CSV...' : '📄 Descarregar .CSV'}
                </button>
              </form>
            </div>

            {/* PAINEL 3: NOVO FORMULÁRIO DE CHECK-IN */}
            <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
              <div className="border-b pb-3">
                <h2 className="text-lg font-bold text-slate-800">📋 Novo Boletim de Alojamento</h2>
                <p className="text-xs text-slate-500">Introduza os dados de identificação do hóspede estrangeiro.</p>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4 text-sm">
                
                {/* 1. Dados Pessoais */}
                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                  <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wider">1. Dados do Hóspede</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div className="sm:col-span-2">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Nome Completo *</label>
                      <input 
                        type="text" 
                        placeholder="Nome conforme consta no documento" 
                        value={novoBoletim.nome} 
                        onChange={e => setNovoBoletim({...novoBoletim, nome: e.target.value})} 
                        className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none" 
                        required 
                      />
                    </div>
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="block text-xs font-semibold text-slate-700">Data de Nascimento *</label>
                        {idadeCalculada !== null && (
                          <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${idadeCalculada < 18 ? 'bg-purple-200 text-purple-900' : 'bg-slate-200 text-slate-700'}`}>
                            {idadeCalculada} {idadeCalculada === 1 ? 'ano' : 'anos'} ({idadeCalculada < 18 ? 'Menor' : 'Adulto'})
                          </span>
                        )}
                      </div>
                      <input 
                        type="date" 
                        value={novoBoletim.dataNascimento} 
                        onChange={e => setNovoBoletim({...novoBoletim, dataNascimento: e.target.value})} 
                        className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Nacionalidade *</label>
                      <select 
                        value={novoBoletim.nacionalidade} 
                        onChange={e => setNovoBoletim({...novoBoletim, nacionalidade: e.target.value})} 
                        className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                      >
                        {PAISES.map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">País de Residência *</label>
                      <select 
                        value={novoBoletim.paisResidencia} 
                        onChange={e => setNovoBoletim({...novoBoletim, paisResidencia: e.target.value})} 
                        className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                      >
                        {PAISES.map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Tipo de Alojamento *</label>
                      <select 
                        value={novoBoletim.tipoAlojamento} 
                        onChange={e => setNovoBoletim({...novoBoletim, tipoAlojamento: e.target.value})} 
                        className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium"
                      >
                        {TIPOS_ALOJAMENTO.map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Número do Alojamento / Unidade *</label>
                      <input 
                        type="text" 
                        placeholder="Ex: N.º 1, 102, R/C" 
                        value={novoBoletim.numeroUnidade} 
                        onChange={e => setNovoBoletim({...novoBoletim, numeroUnidade: e.target.value})} 
                        className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none font-medium" 
                        required 
                      />
                    </div>
                  </div>
                </div>

                {/* PAINEL AUTOMÁTICO DE MENOR DE IDADE */}
                {novoBoletim.eMenor === 'Sim' && (
                  <div className="bg-purple-50 p-4 rounded-lg border border-purple-200 space-y-3 transition-all">
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-purple-900 text-xs uppercase tracking-wider flex items-center gap-1.5">
                        👶 Hóspede Detetado como Menor de Idade ({idadeCalculada} anos)
                      </h3>
                      <span className="text-[11px] font-bold bg-purple-200 text-purple-900 px-2 py-0.5 rounded">
                        Requisito AIMA
                      </span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-purple-200 text-xs">
                      <div>
                        <label className="block font-semibold text-purple-900 mb-1">Titular do Documento Apresentado *</label>
                        <select 
                          value={novoBoletim.titularDoc} 
                          onChange={e => setNovoBoletim({...novoBoletim, titularDoc: e.target.value})} 
                          className="w-full border border-purple-300 p-2.5 rounded bg-white font-medium"
                        >
                          <option value="Documento do Acompanhante">Documento do Acompanhante / Responsável</option>
                          <option value="Documento Próprio do Menor">Documento Próprio do Menor</option>
                        </select>
                      </div>
                      <div>
                        <label className="block font-semibold text-purple-900 mb-1">Qualidade do Acompanhante *</label>
                        <select 
                          value={novoBoletim.qualidadeAcompanhante} 
                          onChange={e => setNovoBoletim({...novoBoletim, qualidadeAcompanhante: e.target.value})} 
                          className="w-full border border-purple-300 p-2.5 rounded bg-white font-medium"
                        >
                          <option value="Pai / Mãe">Pai / Mãe</option>
                          <option value="Tutor Legal">Tutor Legal</option>
                          <option value="Outro Familiar">Outro Familiar</option>
                          <option value="Acompanhante Autorizado">Acompanhante Autorizado</option>
                        </select>
                      </div>
                    </div>
                  </div>
                )}

                {/* 2. Documento */}
                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                  <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wider">
                    2. Documento de Identificação {novoBoletim.eMenor === 'Sim' && novoBoletim.titularDoc === 'Documento do Acompanhante' && '(do Acompanhante Responsável)'}
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Tipo de Documento *</label>
                      <select 
                        value={novoBoletim.docTipo} 
                        onChange={e => setNovoBoletim({...novoBoletim, docTipo: e.target.value})} 
                        className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                      >
                        <option value="Passaporte">Passaporte</option>
                        <option value="Cartão de Cidadão / BI">Cartão de Cidadão / BI</option>
                        <option value="Título de Residência">Título de Residência</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Número do Documento *</label>
                      <input 
                        type="text" 
                        placeholder="N.º do Passaporte ou BI" 
                        value={novoBoletim.docNumero} 
                        onChange={e => setNovoBoletim({...novoBoletim, docNumero: e.target.value})} 
                        className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none font-mono" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">País Emissor *</label>
                      <select 
                        value={novoBoletim.docPais} 
                        onChange={e => setNovoBoletim({...novoBoletim, docPais: e.target.value})} 
                        className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                      >
                        {PAISES.map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                    </div>
                  </div>
                </div>

                {/* 3. Estadia */}
                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                  <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wider">3. Período da Estadia</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Data de Entrada (Check-in) *</label>
                      <input 
                        type="date" 
                        value={novoBoletim.dataEntrada} 
                        onChange={e => setNovoBoletim({...novoBoletim, dataEntrada: e.target.value})} 
                        className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Data Prevista de Saída (Check-out) *</label>
                      <input 
                        type="date" 
                        value={novoBoletim.dataSaida} 
                        onChange={e => setNovoBoletim({...novoBoletim, dataSaida: e.target.value})} 
                        className="w-full border border-slate-300 p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none" 
                        required 
                      />
                    </div>
                  </div>
                </div>

                <button 
                  type="submit" 
                  disabled={loading}
                  className="w-full bg-blue-700 text-white font-bold py-3.5 rounded-lg hover:bg-blue-800 transition shadow text-base disabled:bg-slate-400"
                >
                  {loading ? 'A Guardar...' : '💾 Confirmar Check-in'}
                </button>
              </form>
            </div>
          </main>

          {/* MODAL DE SUCESSO & IMPRESSÃO */}
          {ultimoSucesso && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-slate-200">
                
                {/* ÁREA DE IMPRESSÃO */}
                <div id="printable-boletim" className="space-y-4 text-xs font-sans text-slate-800 p-2">
                  <div className="text-center border-b pb-3">
                    <h2 className="text-base font-bold text-slate-900">🏠 Casa Velha - Comprovativo de Check-in</h2>
                    <p className="text-[11px] text-slate-500">Boletim de Alojamento (AL 166503/AL)</p>
                    <span className="inline-block mt-1 font-mono font-bold bg-blue-100 text-blue-900 px-2 py-0.5 rounded text-xs">
                      ID: {ultimoSucesso.idBoletim}
                    </span>
                  </div>

                  <div className="space-y-2 border-b pb-3">
                    <div><strong className="text-slate-600">Hóspede:</strong> {ultimoSucesso.nome}</div>
                    <div><strong className="text-slate-600">Data de Nascimento:</strong> {ultimoSucesso.dataNascimento} ({ultimoSucesso.eMenor === 'Sim' ? 'Menor' : 'Adulto'})</div>
                    <div><strong className="text-slate-600">Nacionalidade:</strong> {ultimoSucesso.nacionalidade} | <strong className="text-slate-600">Residência:</strong> {ultimoSucesso.paisResidencia}</div>
                    <div><strong className="text-slate-600">Documento:</strong> {ultimoSucesso.docTipo} N.º {ultimoSucesso.docNumero} ({ultimoSucesso.docPais})</div>
                    {ultimoSucesso.eMenor === 'Sim' && (
                      <div className="p-2 bg-purple-50 rounded border border-purple-200">
                        <strong>Informação de Menor:</strong> {ultimoSucesso.titularDoc} | Acompanhante: {ultimoSucesso.qualidadeAcompanhante}
                      </div>
                    )}
                  </div>

                  <div className="space-y-1">
                    <div><strong className="text-slate-600">Alojamento:</strong> {ultimoSucesso.tipoAlojamento} (Unidade {ultimoSucesso.numeroUnidade})</div>
                    <div><strong className="text-slate-600">Check-in:</strong> {ultimoSucesso.dataEntrada} $\rightarrow$ <strong className="text-slate-600">Check-out Previsto:</strong> {ultimoSucesso.dataSaida}</div>
                  </div>
                </div>

                {/* BOTÕES DE AÇÃO */}
                <div className="flex gap-3 pt-2 border-t">
                  <button 
                    onClick={() => window.print()}
                    className="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-lg transition text-xs flex items-center justify-center gap-1.5"
                  >
                    🖨️ Imprimir Boletim (PDF / Papel)
                  </button>
                  <button 
                    onClick={() => setUltimoSucesso(null)}
                    className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold px-4 py-2.5 rounded-lg transition text-xs"
                  >
                    Fechar
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CheckInAIMA />);
  </script>
</body>
</html>
